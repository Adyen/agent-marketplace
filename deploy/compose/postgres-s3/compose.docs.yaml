# Append this override after compose.yaml to serve documentation locally.
services:
  web:
    environment:
      NUXT_PUBLIC_DOCS_ENABLED: "true"

  docs:
    platform: ${MARKETPLACE_PLATFORM:-}
    build:
      context: ../../../site
      dockerfile: Dockerfile
      additional_contexts:
        design: ../../../design
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${SITE_NGINX_IMAGE:-${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29-alpine}}
        SITE_PROFILE: docs
        SITE_BASE: /docs/
        MARKETPLACE_BASE: /
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    # Keep standard mirrored Nginx images usable; the default image is unprivileged.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    volumes:
      - ../shared/docs-enabled.conf:/etc/nginx/marketplace-docs.conf:ro
    depends_on:
      docs:
        condition: service_healthy
