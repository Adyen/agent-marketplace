upstream marketplace_api {
    server api:8080;
}

upstream marketplace_web {
    server web:3000;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    location = /.well-known/agent-marketplace.json {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /healthz {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    # Operations endpoints are available only on the private operations
    # listener, never through the public proxy.
    location = /readyz { return 404; }
    location = /metrics { return 404; }

    include /etc/nginx/marketplace-docs.conf;

    location = /marketplace {
        return 308 /$is_args$args;
    }

    location = /marketplace/ {
        return 308 /$is_args$args;
    }

    location ~ (?s)^/marketplace/(?<legacy_browser_path>[^/].*)$ {
        # Decoded controls and backslashes are unsafe in browser redirects.
        if ($uri ~ "[\x00-\x1F\x7F\\\\]") { return 400; }
        return 308 /$legacy_browser_path$is_args$args;
    }

    location / {
        proxy_pass http://marketplace_web;
        include /etc/nginx/proxy-headers.conf;
    }
}
