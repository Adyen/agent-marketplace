upstream marketplace_api {
    server api:8080;
}

upstream marketplace_web {
    server web:3000;
}

upstream marketplace_docs {
    server docs:8080;
}

server {
    listen 8080;
    server_name _;
    absolute_redirect off;

    location = /.well-known/agent-marketplace.json {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    location /api/ {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    location = /healthz {
        proxy_pass http://marketplace_api;
        include /etc/nginx/proxy-headers.conf;
    }

    # Operations endpoints are available only on the private operations
    # listener, never through the public proxy.
    location = /readyz { return 404; }
    location = /metrics { return 404; }

    location = /docs {
        return 308 /docs/;
    }

    location /docs/ {
        proxy_pass http://marketplace_docs;
        include /etc/nginx/proxy-headers.conf;
    }

    location / {
        proxy_pass http://marketplace_web;
        include /etc/nginx/proxy-headers.conf;
    }
}
