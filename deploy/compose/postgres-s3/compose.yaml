name: agent-marketplace-postgres

x-marketplace-platform: &marketplace-platform ${MARKETPLACE_PLATFORM:-}
x-marketplace-build-args: &marketplace-build-args
  GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-golang:1.26.6-bookworm}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}

services:
  postgres:
    platform: *marketplace-platform
    image: ${POSTGRES_IMAGE:-postgres:17.5-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marketplace}
      POSTGRES_USER: ${POSTGRES_USER:-marketplace}
      POSTGRES_PASSWORD_FILE: /run/secrets/marketplace-postgres-password
    secrets:
      - source: marketplace_postgres_password
        target: marketplace-postgres-password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    platform: *marketplace-platform
    build:
      context: ../../..
      dockerfile: Dockerfile.marketplace
      target: api
      args:
        <<: *marketplace-build-args
        VERSION: ${MARKETPLACE_VERSION:-dev}
    command: ["serve", "--config", "/app/marketplace.yaml", "--role", "api"]
    volumes:
      - ./config.dsn-file.example.yaml:/app/marketplace.yaml:ro
    secrets:
      - source: marketplace_postgres_dsn
        target: marketplace-postgres-dsn
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/marketplace-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    platform: *marketplace-platform
    build:
      context: ../../..
      dockerfile: Dockerfile.marketplace
      target: worker
      args:
        <<: *marketplace-build-args
        VERSION: ${MARKETPLACE_VERSION:-dev}
    command: ["serve", "--config", "/app/marketplace.yaml", "--role", "worker"]
    volumes:
      - ./config.dsn-file.example.yaml:/app/marketplace.yaml:ro
    secrets:
      - source: marketplace_postgres_dsn
        target: marketplace-postgres-dsn
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy

  web:
    platform: *marketplace-platform
    build:
      context: ../../../web
      dockerfile: Dockerfile
      additional_contexts:
        design: ../../../design
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    environment:
      NUXT_APP_BASE_URL: /marketplace/
      NUXT_PUBLIC_API_BASE: /
      NUXT_API_BASE_INTERNAL: http://api:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  site:
    platform: *marketplace-platform
    build:
      context: ../../../site
      dockerfile: Dockerfile
      additional_contexts:
        design: ../../../design
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${SITE_NGINX_IMAGE:-${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.29-alpine}}
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    # Keep standard mirrored Nginx images usable when registries do not mirror
    # nginx-unprivileged; the default site image remains unprivileged.
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: unless-stopped

  proxy:
    platform: *marketplace-platform
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${MARKETPLACE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../shared/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      site:
        condition: service_healthy

volumes:
  postgres-data:

secrets:
  marketplace_postgres_password:
    file: ./secrets/marketplace-postgres-password
  marketplace_postgres_dsn:
    file: ./secrets/marketplace-postgres-dsn
