upstream marketplace_api {
    server 172.30.89.3:8080;
}

upstream marketplace_web {
    server web:3000;
}

upstream landing_site {
    server site:8080;
}

server {
    listen 8080;
    server_name localhost;
    absolute_redirect off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Marketplace-Subject local-operator;
    proxy_set_header X-Marketplace-Groups '["marketplace-admins"]';
    proxy_http_version 1.1;

    location = /.well-known/agent-marketplace.json { proxy_pass http://marketplace_api; }
    location /api/ { proxy_pass http://marketplace_api; }
    location = /healthz { proxy_pass http://marketplace_api; }
    location = /readyz { return 404; }
    location = /metrics { return 404; }
    location = /marketplace { return 308 /marketplace/; }
    location /marketplace/ { proxy_pass http://marketplace_web; }
    location /_fonts/ { proxy_pass http://marketplace_web; }
    location / { proxy_pass http://landing_site; }
}
