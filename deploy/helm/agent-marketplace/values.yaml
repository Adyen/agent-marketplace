mode: all

image:
  repository: agent-marketplace
  # Set an explicit tag for development or a verified digest for production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

podAnnotations: {}
podLabels: {}
podSecurityContext:
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true

terminationGracePeriodSeconds: 30
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []
extraVolumes: []
extraVolumeMounts: []

config:
  enabled: true
  existingConfigMap: ""
  nameOverride: ""
  key: config.yaml
  mountPath: /etc/agent-marketplace/config.yaml
  content: |
    apiVersion: agent-marketplace.io/marketplace/v1
    instance:
      id: example-marketplace
      name: Example Agent Marketplace
      canonical_url: https://marketplace.example.invalid
      browser_base: https://marketplace.example.invalid
    listen: 0.0.0.0:8080
    operations_listen: 0.0.0.0:9090
    storage:
      metadata:
        driver: sqlite
        dsn: /var/lib/agent-marketplace/marketplace.db
      blobs:
        driver: filesystem
        path: /var/lib/agent-marketplace/blobs
    registries: []

persistence:
  enabled: true
  existingClaim: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi
  storageClassName: ""
  mountPath: /var/lib/agent-marketplace

storage:
  dsnSecret:
    name: ""
    key: dsn
    envName: MARKETPLACE_POSTGRES_DSN

api:
  enabled: true
  replicas: 1
  image: {}
  args:
    - serve
    - --config
    - /etc/agent-marketplace/config.yaml
    - --role
    - api
  env: []
  envFrom: []
  resources: {}
  strategy: {}
  podSecurityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    startup:
      enabled: true
      path: /readyz
      port: operations
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      enabled: true
      path: /healthz
      port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: /readyz
      port: operations
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

worker:
  enabled: true
  replicas: 1
  image: {}
  args:
    - serve
    - --config
    - /etc/agent-marketplace/config.yaml
    - --role
    - worker
  env: []
  envFrom: []
  resources: {}
  strategy: {}
  podSecurityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    liveness:
      enabled: false
    readiness:
      enabled: false

all:
  replicas: 1
  image: {}
  args:
    - serve
    - --config
    - /etc/agent-marketplace/config.yaml
    - --role
    - all
  env: []
  envFrom: []
  resources: {}
  strategy: {}
  podSecurityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    startup:
      enabled: true
      path: /readyz
      port: operations
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 30
    liveness:
      enabled: true
      path: /healthz
      port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: /readyz
      port: operations
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

web:
  enabled: false
  replicas: 1
  image:
    repository: agent-marketplace-web
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  basePath: /
  publicApiBase: /
  env: []
  envFrom: []
  resources: {}
  strategy: {}
  podSecurityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    liveness:
      enabled: true
      # Empty path derives from web.basePath (without its trailing slash),
      # because the Nuxt server only serves routes under the base path.
      path: ""
      port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: ""
      port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

docs:
  # Also switches all Marketplace documentation links to origin-root /docs/.
  enabled: false
  replicas: 1
  image:
    repository: agent-marketplace-docs
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  env: []
  envFrom: []
  resources: {}
  strategy: {}
  podSecurityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  probes:
    liveness:
      enabled: true
      path: /docs/
      port: http
      initialDelaySeconds: 10
      periodSeconds: 30
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      enabled: true
      path: /docs/
      port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

service:
  api:
    type: ClusterIP
    port: 8080
    operationsPort: 9090
  web:
    type: ClusterIP
    port: 3000
  docs:
    type: ClusterIP
    port: 8080

ingress:
  enabled: false
  className: ""
  annotations: {}
  tls: []
  hosts: []

networkPolicy:
  enabled: false
  allowSameNamespace: true
  ingressNamespaces: []

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  scheme: http
  labels: {}
  additionalLabels: {}

prometheusRule:
  enabled: false
  labels: {}
  additionalLabels: {}
  ruleLabels: {}
  runbookBaseUrl: ""
  alerts:
    workerDown:
      enabled: true
      for: 10m
      severity: critical
    workerObservationsStalled:
      enabled: true
      for: 15m
      severity: critical
      window: 1h
    registryProbeFailing:
      enabled: true
      for: 5m
      severity: warning
      threshold: 3
    registryObservationStale:
      enabled: true
      for: 10m
      severity: warning
      # Three times the default refresh.interval of 30 minutes.
      staleAfterSeconds: 5400
    registryIndexStale:
      enabled: true
      for: 30m
      severity: warning
      # Twenty-four-hour reconciliation plus two hours of scheduling margin.
      staleAfterSeconds: 93600
    registryNeverIndexed:
      enabled: true
      for: 2h
      severity: warning
    refreshFailures:
      enabled: true
      for: 0m
      severity: warning
      window: 1h
    configCandidateRejected:
      enabled: true
      for: 0m
      severity: warning
      window: 15m
    configRestartRequired:
      enabled: true
      for: 30m
      severity: info
    hostBudgetDelaysSustained:
      enabled: true
      for: 2h
      severity: info
      window: 15m
