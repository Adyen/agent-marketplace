{{- include "agent-marketplace.validate" . -}}
{{- if or (eq .Values.mode "all") .Values.api.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-marketplace.componentName" (dict "root" . "component" "api") }}
  labels:
    {{- include "agent-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.service.api.type }}
  selector:
    {{- include "agent-marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: {{ include "agent-marketplace.apiComponent" . }}
  ports:
    - name: http
      port: {{ .Values.service.api.port }}
      targetPort: http
      protocol: TCP
    - name: operations
      port: {{ .Values.service.api.operationsPort }}
      targetPort: operations
      protocol: TCP
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-marketplace.componentName" (dict "root" . "component" "web") }}
  labels:
    {{- include "agent-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: {{ .Values.service.web.type }}
  selector:
    {{- include "agent-marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: {{ .Values.service.web.port }}
      targetPort: http
      protocol: TCP
{{- end }}
{{- if .Values.docs.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agent-marketplace.componentName" (dict "root" . "component" "docs") }}
  labels:
    {{- include "agent-marketplace.labels" . | nindent 4 }}
    app.kubernetes.io/component: docs
spec:
  type: {{ .Values.service.docs.type }}
  selector:
    {{- include "agent-marketplace.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: docs
  ports:
    - name: http
      port: {{ .Values.service.docs.port }}
      targetPort: http
      protocol: TCP
{{- end }}
