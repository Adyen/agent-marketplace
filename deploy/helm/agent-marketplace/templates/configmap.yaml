{{- include "agent-marketplace.validate" . -}}
{{- if and .Values.config.enabled (not .Values.config.existingConfigMap) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "agent-marketplace.configMapName" . }}
  labels:
    {{- include "agent-marketplace.labels" . | nindent 4 }}
data:
  {{ .Values.config.key }}: |
{{ .Values.config.content | nindent 4 }}
{{- end }}
