rule_files: []
evaluation_interval: 1d
tests:
  - interval: 1d
    input_series:
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="kept",config_fingerprint="old"}'
        values: '3455998000000+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="kept",config_fingerprint="new",pod="one"}'
        values: '3455999000000+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="kept",config_fingerprint="new",pod="two"}'
        values: '3455999000000+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="kept",config_fingerprint="old",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="removed"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="kept",config_fingerprint="new",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="alpha",pod="one"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="kept",config_fingerprint="new",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="alpha",pod="two"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="kept",config_fingerprint="new",registry_id="example.test/team/alpha",resource_kind="rule",resource_name="policy"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="empty",config_fingerprint="old"}'
        values: '3455998000000+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="empty",config_fingerprint="new"}'
        values: '3455999000000+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="empty",config_fingerprint="old",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="removed-empty"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="tied",config_fingerprint="a"}'
        values: '3455999000000+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="tied",config_fingerprint="b"}'
        values: '3455999000000+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="tied",config_fingerprint="a",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="ambiguous-a"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="tied",config_fingerprint="b",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="ambiguous-b"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="stale",config_fingerprint="old-value"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="stale",config_fingerprint="old-value",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="stale"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="ops",installation_id="future",config_fingerprint="future-value"}'
        values: '3456001000000+0x40'
      - series: 'agent_marketplace_config_resource{namespace="ops",installation_id="future",config_fingerprint="future-value",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="future"}'
        values: '1+0x40'
      - series: 'agent_marketplace_config_snapshot{namespace="other",installation_id="kept",config_fingerprint="outside"}'
        values: '3456000000000+0x40'
      - series: 'agent_marketplace_config_resource{namespace="other",installation_id="kept",config_fingerprint="outside",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="outside"}'
        values: '1+0x40'
    promql_expr_test:
      - expr: >-
          label_replace((max by (installation_id, config_fingerprint) (last_over_time(agent_marketplace_config_snapshot{namespace="ops"}[30d])) == on (installation_id) group_left max by (installation_id) (max by (installation_id, config_fingerprint) (last_over_time(agent_marketplace_config_snapshot{namespace="ops"}[30d])))), "inventory_type", "snapshot", "", "") or label_replace((max by (installation_id, config_fingerprint, registry_id, resource_kind, resource_name) (last_over_time(agent_marketplace_config_resource{namespace="ops",resource_kind!="rule"}[30d])) and on (installation_id, config_fingerprint) (max by (installation_id, config_fingerprint) (last_over_time(agent_marketplace_config_snapshot{namespace="ops"}[30d])) == on (installation_id) group_left max by (installation_id) (max by (installation_id, config_fingerprint) (last_over_time(agent_marketplace_config_snapshot{namespace="ops"}[30d]))))), "inventory_type", "resource", "", "")
        eval_time: 40d
        exp_samples:
          - labels: '{installation_id="kept",config_fingerprint="new",inventory_type="snapshot"}'
            value: 3455999000000
          - labels: '{installation_id="empty",config_fingerprint="new",inventory_type="snapshot"}'
            value: 3455999000000
          - labels: '{installation_id="tied",config_fingerprint="a",inventory_type="snapshot"}'
            value: 3455999000000
          - labels: '{installation_id="tied",config_fingerprint="b",inventory_type="snapshot"}'
            value: 3455999000000
          - labels: '{installation_id="stale",config_fingerprint="old-value",inventory_type="snapshot"}'
            value: 1
          - labels: '{installation_id="future",config_fingerprint="future-value",inventory_type="snapshot"}'
            value: 3456001000000
          - labels: '{installation_id="kept",config_fingerprint="new",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="alpha",inventory_type="resource"}'
            value: 1
          - labels: '{installation_id="tied",config_fingerprint="a",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="ambiguous-a",inventory_type="resource"}'
            value: 1
          - labels: '{installation_id="tied",config_fingerprint="b",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="ambiguous-b",inventory_type="resource"}'
            value: 1
          - labels: '{installation_id="stale",config_fingerprint="old-value",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="stale",inventory_type="resource"}'
            value: 1
          - labels: '{installation_id="future",config_fingerprint="future-value",registry_id="example.test/team/alpha",resource_kind="skill",resource_name="future",inventory_type="resource"}'
            value: 1
