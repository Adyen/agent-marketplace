# Catalog data for pkg/harness-compilation/hookpolicy/catalogs/devin.yaml.
schema: 1
harness: devin
evidence:
  checked: "2026-10-27"
  refs:
    - https://docs.devin.ai/cli/extensibility/hooks/overview
    - https://docs.devin.ai/cli/extensibility/hooks/lifecycle-hooks
  notes: >-
    Matchers are unanchored regexes on tool_name ("exec" matches any name
    containing exec), so output is always anchored. Matchers apply only to
    PreToolUse, PostToolUse, and PermissionRequest. Devin also loads Claude
    Code hook files when read_config_from.claude is enabled (the default).
    Devin CLI v3000.11.92 (https://docs.devin.ai/cli/changelog/stable) added
    PreCompact and PostCompact command hooks with manual and auto compaction
    matchers; the hook-reference pages do not list them yet. PostCompaction
    stays accepted for ingestion and same-harness output, but is never chosen
    as the target of another harness.

env:
  project_dir: [DEVIN_PROJECT_DIR]
plugin_env: {}

repository_base: {env: project_dir}
timeout: {unit: seconds}
matcher: {syntax: regex, anchor: true}
loads_hooks_of: [claude]

events:
  PreToolUse: {canonical: PreToolUse, matcher: tool, types: [command, prompt]}
  PostToolUse: {canonical: PostToolUse, matcher: tool, types: [command, prompt]}
  PermissionRequest: {canonical: PermissionRequest, matcher: tool, types: [command, prompt]}
  UserPromptSubmit: {canonical: UserPromptSubmit, matcher: none, types: [command, prompt]}
  Stop: {canonical: Stop, matcher: none, types: [command, prompt]}
  SessionStart: {canonical: SessionStart, matcher: none, types: [command, prompt]}
  SessionEnd: {canonical: SessionEnd, matcher: none, types: [command, prompt]}
  PreCompact: {canonical: PreCompact, matcher: lifecycle, types: [command]}
  PostCompact: {canonical: PostCompact, matcher: lifecycle, types: [command]}
  PostCompaction: {canonical: PostCompact, matcher: none, types: [command, prompt], ingest_only: true}
