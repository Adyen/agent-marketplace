name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  tui-qa-driver:
    name: TUI QA Driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tools/tui-qa/.node-version
          cache: npm
          cache-dependency-path: tools/tui-qa/package-lock.json

      - name: Install exact TUI QA dependencies
        run: npm ci
        working-directory: tools/tui-qa

      - name: Run TUI QA driver self-tests
        run: npm run check
        working-directory: tools/tui-qa

      - name: Run contained non-blocking TUI baseline
        env:
          TUI_QA_BASE_IMAGE: node:24.18.0-bookworm-slim@sha256:6f7b03f7c2c8e2e784dcf9295400527b9b1270fd37b7e9a7285cf83b6951452d
          TUI_QA_BASE_FLAVOR: debian-node
        run: AM_TUI_QA_RUN_ID="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" AM_TUI_QA_RUN_CLASS=pr tools/tui-qa/run-container.sh || test -f ".local/agent-marketplace/qa/tui/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/artifacts/results.json"

      - name: Validate contained baseline artifacts
        run: jq -e '.schemaVersion == 1 and .runClass == "pr"' ".local/agent-marketplace/qa/tui/ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}/artifacts/results.json" >/dev/null

      - name: Upload sanitized TUI QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/agent-marketplace/qa/tui/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/results.json
            .local/agent-marketplace/qa/tui/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/report.md
            .local/agent-marketplace/qa/tui/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/build-identity.json
            .local/agent-marketplace/qa/tui/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/containment-selftest.txt
            .local/agent-marketplace/qa/tui/ci-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/flows
          if-no-files-found: warn
          retention-days: 7

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          install-only: true

      - name: Run linters
        run: make ci-lint

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ""
          repo-checkout: false

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test, lint, govulncheck]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: make release

      - name: Upload release binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
