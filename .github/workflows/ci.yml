name: CI

on:
  push:
    branches:
      - main
    tags:
      # Only the release tag shape reaches the privileged release job. These
      # globs are a coarse filter (GitHub filter patterns cannot express SemVer);
      # scripts/validate-release-tag.sh is the authoritative gate.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default: every job below opts in to exactly what it needs.
#   build / test / lint / govulncheck / release-tag-guard: contents: read
#     (checkout only, no token persisted).
#   release: contents: write, required solely to publish the GitHub Release and
#     upload its assets, and reachable only after the tag guard has passed.
# No job requests id-token, packages, pull-requests, or actions permissions.
permissions: {}

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          install-only: true

      - name: Run linters
        run: make ci-lint

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ""
          repo-checkout: false

  # Tag names are attacker-controllable text, so they are validated in an
  # unprivileged job before any job that can write releases runs. The tag never
  # reaches a `run:` script through `${{ }}` interpolation; it is passed as an
  # environment variable and quoted.
  release-tag-guard:
    name: Validate release tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/validate-release-tag.sh "$RELEASE_TAG"

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [release-tag-guard, build, test, lint, govulncheck]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    # Restricts who can actually publish: the `release` environment carries the
    # required reviewers and tag-ref deployment rules documented in
    # docs/release-process.md.
    environment: release
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Re-validated inside this job so the strict SemVer contract is enforced
      # here even if `needs` is ever edited, and always before Make or the Go
      # toolchain sees the tag-derived VERSION.
      - name: Validate release tag
        run: ./scripts/validate-release-tag.sh "$VERSION"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: make release

      - name: Upload release binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
