name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CGO_ENABLED: "0"

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      go_build: ${{ steps.changes.outputs.go_build }}
      go_test: ${{ steps.changes.outputs.go_test }}
      benchmark: ${{ steps.changes.outputs.benchmark }}
      marketplace_e2e: ${{ steps.changes.outputs.marketplace_e2e }}
      tui_qa: ${{ steps.changes.outputs.tui_qa }}
      container_config: ${{ steps.changes.outputs.container_config }}
      container_marketplace: ${{ steps.changes.outputs.container_marketplace }}
      container_web: ${{ steps.changes.outputs.container_web }}
      container_site: ${{ steps.changes.outputs.container_site }}
      helm: ${{ steps.changes.outputs.helm }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | go run ./tools/ci-plan
          else
            go run ./tools/ci-plan --all
          fi >> "$GITHUB_OUTPUT"

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.go_build == 'true' || needs.changes.outputs.container_config == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        if: needs.changes.outputs.go_build == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        if: needs.changes.outputs.go_build == 'true'
        run: make build

      - name: Validate container packaging and Compose files
        if: needs.changes.outputs.container_config == 'true'
        run: make container-check compose-config

  helm:
    name: Helm chart
    needs: changes
    if: needs.changes.outputs.helm == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.18.4

      - name: Validate and package Helm chart
        shell: bash
        env:
          CHART_DIR: deploy/helm/agent-marketplace
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/helm"
          values_file="$RUNNER_TEMP/helm-values.yaml"
          mkdir -p "$package_dir"

          cat > "$values_file" <<'EOF'
          mode: split
          fullnameOverride: agent-marketplace
          persistence:
            enabled: false
          config:
            nameOverride: agent-marketplace
            key: marketplace.yaml
            content: |
              apiVersion: agent-marketplace.io/marketplace/v1
              instance:
                id: ci-marketplace
                name: CI Agent Marketplace
                canonical_url: https://marketplace.example.invalid
              listen: 0.0.0.0:8080
              operations_listen: 0.0.0.0:9090
              marker: checksum-marker-one
          api:
            strategy:
              type: RollingUpdate
              rollingUpdate:
                maxSurge: 1
                maxUnavailable: 0
            extraVolumes:
              - name: custom-ca
                secret:
                  secretName: custom-ca
            extraVolumeMounts:
              - name: custom-ca
                mountPath: /etc/ssl/custom-ca
                readOnly: true
          worker:
            strategy:
              type: Recreate
            extraVolumes:
              - name: custom-ca
                secret:
                  secretName: custom-ca
            extraVolumeMounts:
              - name: custom-ca
                mountPath: /etc/ssl/custom-ca
                readOnly: true
          web:
            enabled: true
            podSecurityContext:
              runAsUser: 1000
              runAsGroup: 1000
          site:
            enabled: true
          ingress:
            enabled: true
            className: example-ingress
            hosts:
              - host: marketplace.example.invalid
                paths:
                  - path: /
                    pathType: Prefix
                    service: api
                    port: 8080
          networkPolicy:
            enabled: true
          serviceMonitor:
            enabled: true
          EOF

          null_env_values_file="$RUNNER_TEMP/helm-null-env-values.yaml"
          null_network_values_file="$RUNNER_TEMP/helm-null-network-values.yaml"
          cat > "$null_env_values_file" <<'EOF'
          mode: all
          persistence:
            enabled: false
          all:
            env: null
          EOF
          cat > "$null_network_values_file" <<'EOF'
          mode: all
          persistence:
            enabled: false
          networkPolicy:
            enabled: true
            allowSameNamespace: false
            ingressNamespaces: null
          EOF

          helm lint --strict "$CHART_DIR"
          helm lint --strict "$CHART_DIR" --values "$values_file"
          helm template marketplace "$CHART_DIR" --namespace marketplace > "$package_dir/default-rendered.yaml"
          helm template marketplace "$CHART_DIR" --namespace marketplace --values "$values_file" > "$package_dir/configured-rendered.yaml"
          if [[ "$(grep -c '^kind: Deployment$' "$package_dir/default-rendered.yaml")" -ne 1 ]]; then
            echo "default chart should render exactly one Deployment" >&2
            exit 1
          fi

          extract_doc() {
            awk -v target_kind="$1" -v target_name="$2" '
              function emit_if_match() {
                if (doc ~ "(^|\\n)kind: " target_kind "(\\n|$)" &&
                    doc ~ "(^|\\n)metadata:\\n  name: " target_name "(\\n|$)") {
                  found = 1
                  printf "%s", doc
                  exit
                }
              }
              /^---[[:space:]]*$/ {
                if (length(doc)) emit_if_match()
                doc = ""
                next
              }
              { doc = doc $0 "\n" }
              END {
                if (!found && length(doc)) emit_if_match()
                if (!found) exit 1
              }
            ' "$3"
          }

          require() {
            local description="$1"
            local haystack="$2"
            local needle="$3"
            if ! grep -Fq "$needle" <<<"$haystack"; then
              echo "assertion failed: $description (missing: $needle)" >&2
              exit 1
            fi
          }

          reject() {
            local description="$1"
            local haystack="$2"
            local needle="$3"
            if grep -Fq "$needle" <<<"$haystack"; then
              echo "assertion failed: $description (unexpected: $needle)" >&2
              exit 1
            fi
          }

          rendered="$package_dir/configured-rendered.yaml"
          configmap_doc="$(extract_doc ConfigMap agent-marketplace "$rendered")"
          api_doc="$(extract_doc Deployment agent-marketplace-api "$rendered")"
          worker_doc="$(extract_doc Deployment agent-marketplace-worker "$rendered")"
          web_doc="$(extract_doc Deployment agent-marketplace-web "$rendered")"
          site_doc="$(extract_doc Deployment agent-marketplace-site "$rendered")"
          api_service_doc="$(extract_doc Service agent-marketplace-api "$rendered")"
          monitor_doc="$(extract_doc ServiceMonitor agent-marketplace-api "$rendered")"

          require "chart-managed ConfigMap carries the configured key" "$configmap_doc" "marketplace.yaml: |"
          require "API deployment mounts config under the configured key" "$api_doc" "subPath: marketplace.yaml"

          require "API strategy is RollingUpdate" "$api_doc" "type: RollingUpdate"
          require "API rolling update keeps zero unavailable" "$api_doc" "maxUnavailable: 0"
          require "API rolling update allows one surge" "$api_doc" "maxSurge: 1"
          require "worker strategy is Recreate" "$worker_doc" "type: Recreate"
          reject "worker must not render a rollingUpdate block" "$worker_doc" "rollingUpdate:"

          require "API startup probe is rendered" "$api_doc" "startupProbe:"
          startup_block="$(awk '/^          startupProbe:$/ { capture = 1; next } capture && /^          [a-zA-Z]/ { exit } capture' <<<"$api_doc")"
          require "API startup probe path" "$startup_block" "path: /readyz"
          require "API startup probe port" "$startup_block" "port: operations"
          require "API startup probe period" "$startup_block" "periodSeconds: 5"
          require "API startup probe timeout" "$startup_block" "timeoutSeconds: 3"
          require "API startup probe threshold" "$startup_block" "failureThreshold: 30"
          reject "worker has no HTTP listener" "$worker_doc" "startupProbe:"

          require "web pod runs as UID 1000" "$web_doc" "runAsUser: 1000"
          require "web pod runs as GID 1000" "$web_doc" "runAsGroup: 1000"
          reject "web pod UID must not leak into API" "$api_doc" "runAsUser: 1000"

          require "API mounts the custom CA volume" "$api_doc" "mountPath: /etc/ssl/custom-ca"
          require "API declares the custom CA secret volume" "$api_doc" "secretName: custom-ca"
          require "worker mounts the custom CA volume" "$worker_doc" "mountPath: /etc/ssl/custom-ca"
          require "worker declares the custom CA secret volume" "$worker_doc" "secretName: custom-ca"
          reject "web must not mount the custom CA volume" "$web_doc" "custom-ca"
          reject "site must not mount the custom CA volume" "$site_doc" "custom-ca"

          require "API Service exposes the operations port" "$api_service_doc" "port: 9090"
          require "API Service targets the operations port" "$api_service_doc" "targetPort: operations"
          require "ServiceMonitor selects the operations port" "$monitor_doc" "port: operations"
          reject "ServiceMonitor must not use targetPort" "$monitor_doc" "targetPort:"
          require "ServiceMonitor declares the scheme" "$monitor_doc" "scheme: http"

          checksum_of() {
            local checksums
            checksums="$(grep -oE 'checksum/config: [0-9a-f]{64}' <<<"$1" || true)"
            if [[ -z "$checksums" ]] || [[ "$checksums" == *$'\n'* ]]; then
              return 1
            fi
            printf '%s' "${checksums#checksum/config: }"
          }
          if ! api_checksum="$(checksum_of "$api_doc")"; then
            echo "assertion failed: API deployment must carry exactly one 64-hex checksum/config annotation" >&2
            exit 1
          fi
          if ! worker_checksum="$(checksum_of "$worker_doc")"; then
            echo "assertion failed: worker deployment must carry exactly one 64-hex checksum/config annotation" >&2
            exit 1
          fi
          if [[ "$worker_checksum" != "$api_checksum" ]]; then
            echo "assertion failed: API and worker checksum/config annotations must match" >&2
            exit 1
          fi
          reject "frontend pods do not consume chart-managed config" "$web_doc" "checksum/config"

          values_file_b="$RUNNER_TEMP/helm-values-b.yaml"
          sed 's/checksum-marker-one/checksum-marker-two/' "$values_file" > "$values_file_b"
          helm template marketplace "$CHART_DIR" --namespace marketplace --values "$values_file_b" > "$package_dir/configured-rendered-b.yaml"
          api_doc_b="$(extract_doc Deployment agent-marketplace-api "$package_dir/configured-rendered-b.yaml")"
          if ! api_checksum_b="$(checksum_of "$api_doc_b")"; then
            echo "assertion failed: second render API deployment must carry exactly one 64-hex checksum/config annotation" >&2
            exit 1
          fi
          if [[ "$api_checksum_b" == "$api_checksum" ]]; then
            echo "assertion failed: config content change must change the rollout checksum" >&2
            exit 1
          fi

          helm template marketplace "$CHART_DIR" --namespace marketplace --values "$null_env_values_file" > "$package_dir/null-env-rendered.yaml"
          if helm template marketplace "$CHART_DIR" --namespace marketplace --values "$null_network_values_file" > /dev/null 2>"$package_dir/null-network-error.txt"; then
            echo "null ingressNamespaces should fail network policy validation" >&2
            exit 1
          fi
          if ! grep -Fq "networkPolicy requires allowSameNamespace or at least one ingressNamespaces entry" "$package_dir/null-network-error.txt"; then
            cat "$package_dir/null-network-error.txt" >&2
            exit 1
          fi
          if grep -Fq "len of nil pointer" "$package_dir/null-network-error.txt"; then
            cat "$package_dir/null-network-error.txt" >&2
            exit 1
          fi
          helm package "$CHART_DIR" --destination "$package_dir"
          package_paths=("$package_dir"/*.tgz)
          if (( ${#package_paths[@]} != 1 )) || [[ ! -f "${package_paths[0]}" ]]; then
            echo "expected exactly one packaged chart in $package_dir" >&2
            exit 1
          fi
          helm template marketplace "${package_paths[0]}" --namespace marketplace --values "$values_file" > "$package_dir/package-rendered.yaml"

  container-images:
    name: Container images (public defaults)
    needs: changes
    if: needs.changes.outputs.container_marketplace == 'true' || needs.changes.outputs.container_web == 'true' || needs.changes.outputs.container_site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build API image
        if: needs.changes.outputs.container_marketplace == 'true'
        run: docker build --pull --target api --tag agent-marketplace-api:ci --file Dockerfile.marketplace .

      - name: Build worker image
        if: needs.changes.outputs.container_marketplace == 'true'
        run: docker build --pull --target worker --tag agent-marketplace-worker:ci --file Dockerfile.marketplace .

      - name: Build web image
        if: needs.changes.outputs.container_web == 'true'
        run: make WEB_CONTAINER_IMAGE=agent-marketplace-web:ci container-web

      - name: Build site image
        if: needs.changes.outputs.container_site == 'true'
        run: make SITE_CONTAINER_IMAGE=agent-marketplace-site:ci container-site

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.go_test == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  tui-qa:
    name: TUI QA (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.tui_qa == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tools/tui-qa/.node-version

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install exact TUI QA dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools/tui-qa

      - name: Build real TUI test binary
        run: CGO_ENABLED=0 go build -tags e2e -ldflags "-X main.version=tui-qa-${GITHUB_SHA}" -o "$RUNNER_TEMP/agent-marketplace-tui-qa" ./cmd/agent-marketplace

      - name: Run direct TUI usage tests
        env:
          AM_TUI_QA_REPO_ROOT: ${{ github.workspace }}
          AM_TUI_QA_BINARY: ${{ runner.temp }}/agent-marketplace-tui-qa
        run: pnpm qa
        working-directory: tools/tui-qa

  tui-qa-required:
    name: TUI QA Driver
    if: always()
    needs: [changes, tui-qa]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Require all TUI QA platforms
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_TUI_QA: ${{ needs.changes.outputs.tui_qa }}
          TUI_QA_RESULT: ${{ needs.tui-qa.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [[ "$RUN_TUI_QA" == true ]]; then
            test "$TUI_QA_RESULT" = success
          else
            test "$RUN_TUI_QA" = false
            test "$TUI_QA_RESULT" = skipped
          fi

  marketplace-gate:
    name: Marketplace E2E gate
    needs: changes
    if: needs.changes.outputs.marketplace_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      E2E_PARALLEL: "4"
      GIT_TERMINAL_PROMPT: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Run Marketplace gate
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/e2e-artifacts"
          E2E_REPORT="$RUNNER_TEMP/e2e-artifacts/e2e-report.json" \
            make marketplace-gate 2>&1 | tee "$RUNNER_TEMP/e2e-artifacts/marketplace-gate.log"

      - name: Upload Marketplace gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: marketplace-gate-${{ runner.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/e2e-artifacts/
          if-no-files-found: warn
          retention-days: 7

  upgrade-gate:
    name: Pre-v4 upgrade E2E gate
    needs: changes
    if: needs.changes.outputs.marketplace_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the historical release executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v3.1.1 --repo "$GITHUB_REPOSITORY" --pattern agent-marketplace-v3.1.1-linux-amd64 --dir "$RUNNER_TEMP"
          printf '%s  %s\n' 3e66fd4d88c03282e7505c60ee912c6f9d0f66a7db91b0d8512e6090993ab059 "$RUNNER_TEMP/agent-marketplace-v3.1.1-linux-amd64" | sha256sum --check
          chmod u+x "$RUNNER_TEMP/agent-marketplace-v3.1.1-linux-amd64"

      - name: Exercise pre-v4 installation with the candidate
        env:
          AM_E2E_PRE_V4_BINARY: ${{ runner.temp }}/agent-marketplace-v3.1.1-linux-amd64
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/upgrade-artifacts"
          make upgrade-gate 2>&1 | tee "$RUNNER_TEMP/upgrade-artifacts/upgrade-gate.log"

      - name: Upload upgrade-gate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: upgrade-gate-${{ runner.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/upgrade-artifacts/
          if-no-files-found: warn
          retention-days: 7

  released-client-gate:
    name: Released-client compatibility E2E gate
    needs: changes
    if: needs.changes.outputs.marketplace_e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Verify the latest release executable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v4.0.8 --repo "$GITHUB_REPOSITORY" --pattern agent-marketplace-v4.0.8-linux-amd64 --dir "$RUNNER_TEMP"
          printf '%s  %s\n' 02a34b1786ffbe2cf2d19f5163a9383ab5712c61db44636abc803771654665bb "$RUNNER_TEMP/agent-marketplace-v4.0.8-linux-amd64" | sha256sum --check
          chmod u+x "$RUNNER_TEMP/agent-marketplace-v4.0.8-linux-amd64"

      - name: Build git-capable runner image
        run: printf 'FROM golang:1.26-alpine\nRUN apk add --no-cache git\n' | docker build -t agent-marketplace-git-runner:ci -

      - name: Exercise committed state with the latest release
        env:
          AM_E2E_RELEASED_BINARY: ${{ runner.temp }}/agent-marketplace-v4.0.8-linux-amd64
          AM_E2E_RELEASED_IMAGE: agent-marketplace-git-runner:ci
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/released-client-artifacts"
          make released-client-gate 2>&1 | tee "$RUNNER_TEMP/released-client-artifacts/released-client-gate.log"

      - name: Upload released-client diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: released-client-gate-${{ runner.os }}-${{ github.run_id }}
          path: ${{ runner.temp }}/released-client-artifacts/
          if-no-files-found: warn
          retention-days: 7

  benchmark:
    name: Benchmark
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.benchmark == 'true' || contains(github.event.pull_request.labels.*.name, 'run-benchmarks'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCHMARK_PACKAGES: ./internal/resolver ./internal/materialize ./internal/tui ./internal/catalog ./internal/config ./cmd/agent-marketplace ./internal/cache ./pkg/harness-compilation ./internal/dependencytxn ./internal/lockfile ./internal/sourcerevision ./internal/pipeline ./internal/marketplace ./internal/marketplacelock
      BENCHMARK_PATTERN: ^Benchmark(ResolveDefaultAllLargeCatalog|RunDryRunLargeMixedResources|BuildRowsLargeMixed|LoadFSHCCIngest|MergeLayersLargeConfig|BuildListRows|GarbageCollectDryRun|MaterializeLargeArtifacts|CompileBundleLarge|SyncWarmUnchangedRemoteGitLock|SyncLocalGitDiskIONoNetwork|ResolveExactGitRef|CommitUnchanged|CheckPending|PlanUnchanged|Build|ProjectLockedRoots|LoadStableEffectiveIncludes|ExactGitGCDryRunFilesystem|MutableLocalGitBatchDiskIONoNetwork|VerifyExactGitTrackedTreeDiskNoNetwork|GitAuthEnvironment|ReadOnlyGitDocumentMatches|OrganizationIncludeTreeDiskReads|CaptureSnapshotTraversalDiskIO|CaptureAggregateDetailDiskIO|HookSupportFiles|DiscoverLegacyFallback|WarmConfiguredLegacyInstallDiskIO|ProvisionalManyMarketplaceSources|ApplySnapshotStatusWithoutPendingMutation|ResolveCachedNoFetch|MarketplaceInstallWarmRegistries|AliasedMarketplaceSkillDryRunDiskIONoNetwork)$
      BENCHSTAT_VERSION: v0.0.0-20260709024250-82a0b07e230d
      GOMAXPROCS: 2
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: benchmark-head
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchmark-head/go.mod
          cache-dependency-path: |
            benchmark-base/go.sum
            benchmark-head/go.sum

      - name: Install benchstat
        working-directory: benchmark-head
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/perf/cmd/benchstat@$BENCHSTAT_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Select available benchmark packages
        run: |
          for checkout in base head; do
            packages=()
            for package in $BENCHMARK_PACKAGES; do
              if [ -d "benchmark-$checkout/$package" ]; then
                packages+=("$package")
              fi
            done
            echo "BENCHMARK_${checkout^^}_PACKAGES=${packages[*]}" >> "$GITHUB_ENV"
          done

      - name: Benchmark base
        working-directory: benchmark-base
        run: |
          if ! go test -v -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_BASE_PACKAGES > "$GITHUB_WORKSPACE/benchmark-base.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-base.txt"
            exit 1
          fi

      - name: Benchmark pull request
        working-directory: benchmark-head
        run: |
          if ! go test -v -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_HEAD_PACKAGES > "$GITHUB_WORKSPACE/benchmark-head.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-head.txt"
            exit 1
          fi

      - name: Build benchmark report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-base.txt > benchmark-base-clean.txt
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-head.txt > benchmark-head-clean.txt
          benchstat -table '' benchmark-base-clean.txt benchmark-head-clean.txt | tee benchmark-stat.txt
          awk '
            BEGIN { change["sec/op"] = change["B/op"] = change["allocs/op"] = "n/a" }
            /sec\/op.*vs base/ { unit = "sec/op" }
            /B\/op.*vs base/ { unit = "B/op" }
            /allocs\/op.*vs base/ { unit = "allocs/op" }
            /^geomean/ && unit != "" { change[unit] = $NF }
            END {
              printf "- Geomean: **%s sec/op**\n", change["sec/op"]
              printf "- **%s B/op**\n", change["B/op"]
              printf "- **%s allocs/op**\n", change["allocs/op"]
            }
          ' benchmark-stat.txt > benchmark-summary.txt
          {
            echo '<!-- agent-marketplace-benchmark-results -->'
            echo '## Benchmark comparison'
            echo
            echo "Compared \`${BASE_SHA:0:12}\` (base) with \`${HEAD_SHA:0:12}\` (pull request) on the same runner."
            echo
            cat benchmark-summary.txt
            echo
            echo '<details><summary>Full benchstat output</summary>'
            echo
            head -n 400 benchmark-stat.txt | sed 's/^/    /'
            echo
            echo '</details>'
            echo
            echo '_Informational only; benchmark changes do not fail CI._'
          } > benchmark-comment.md
          cat benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          marker='<!-- agent-marketplace-benchmark-results -->'
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))) | first | .id // empty")
          if [ -n "$comment_id" ]; then
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input -
          else
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          install-only: true

      - name: Run linters
        run: make ci-lint

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ""
          repo-checkout: false

  web:
    name: Web checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: API contract drift
        run: pnpm run api:drift

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm run e2e:install

      - name: Browser E2E gate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH }}
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ vars.AGENT_BROWSER_EXECUTABLE_PATH }}
        run: pnpm run test:e2e

  classify-release-tag:
    name: Classify release tag
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      stable: ${{ steps.classify.outputs.stable }}
    steps:
      - name: Classify tag
        id: classify
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, helm, test, lint, govulncheck, marketplace-gate, upgrade-gate, released-client-gate, tui-qa-required, web, classify-release-tag]
    if: needs.classify-release-tag.outputs.stable == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: make release

      - name: Upload release binaries
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          generate_release_notes: true
