name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: make build

      - name: Validate container packaging and Compose files
        run: make container-check compose-config

  container:
    name: Build telemetry receiver container
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build container
        run: docker build --file Dockerfile.telemetry-receiver --tag agent-marketplace-telemetry-receiver:ci .
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make test

  tui-qa:
    name: TUI QA Driver
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: tools/tui-qa/.node-version

      - name: Enable pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Install exact TUI QA dependencies
        run: pnpm install --frozen-lockfile
        working-directory: tools/tui-qa

      - name: Build real TUI test binary
        run: CGO_ENABLED=0 go build -tags e2e -ldflags "-X main.version=tui-qa-${GITHUB_SHA}" -o "$RUNNER_TEMP/agent-marketplace-tui-qa" ./cmd/agent-marketplace

      - name: Run direct TUI usage tests
        env:
          AM_TUI_QA_REPO_ROOT: ${{ github.workspace }}
          AM_TUI_QA_BINARY: ${{ runner.temp }}/agent-marketplace-tui-qa
          AM_TUI_QA_ARTIFACT_DIR: ${{ runner.temp }}/agent-marketplace-tui-qa-artifacts
          AM_TUI_QA_RUN_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: pnpm qa
        working-directory: tools/tui-qa

      - name: Upload sanitized TUI snapshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tui-qa-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/agent-marketplace-tui-qa-artifacts/snapshots/
          if-no-files-found: warn
          retention-days: 7

  marketplace-gate:
    name: Marketplace E2E gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Enable pnpm
        run: corepack enable

      - name: Install web dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install Chromium
        working-directory: web
        run: pnpm run e2e:install

      - name: Run Marketplace gate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH }}
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ vars.AGENT_BROWSER_EXECUTABLE_PATH }}
        run: make marketplace-gate

  benchmark:
    name: Benchmark
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCHMARK_PACKAGES: ./internal/resolver ./internal/materialize ./internal/tui ./internal/catalog ./internal/config ./cmd/agent-marketplace ./internal/cache ./pkg/harness-compilation
      BENCHMARK_PATTERN: Benchmark(ResolveDefaultAllLargeCatalog|RunDryRunLargeMixedResources|BuildRowsLargeMixed|LoadFSHCCIngest|MergeLayersLargeConfig|BuildListRows|GarbageCollectDryRun|MaterializeLargeArtifacts|CompileBundleLarge)$
      BENCHSTAT_VERSION: v0.0.0-20260709024250-82a0b07e230d
      GOMAXPROCS: 2
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: benchmark-head
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchmark-head/go.mod
          cache-dependency-path: |
            benchmark-base/go.sum
            benchmark-head/go.sum

      - name: Install benchstat
        working-directory: benchmark-head
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/perf/cmd/benchstat@$BENCHSTAT_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Benchmark base
        working-directory: benchmark-base
        run: |
          if ! go test -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_PACKAGES > "$GITHUB_WORKSPACE/benchmark-base.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-base.txt"
            exit 1
          fi

      - name: Benchmark pull request
        working-directory: benchmark-head
        run: |
          if ! go test -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_PACKAGES > "$GITHUB_WORKSPACE/benchmark-head.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-head.txt"
            exit 1
          fi

      - name: Build benchmark report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-base.txt > benchmark-base-clean.txt
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-head.txt > benchmark-head-clean.txt
          benchstat -table '' benchmark-base-clean.txt benchmark-head-clean.txt | tee benchmark-stat.txt
          awk '
            BEGIN { change["sec/op"] = change["B/op"] = change["allocs/op"] = "n/a" }
            /sec\/op.*vs base/ { unit = "sec/op" }
            /B\/op.*vs base/ { unit = "B/op" }
            /allocs\/op.*vs base/ { unit = "allocs/op" }
            /^geomean/ && unit != "" { change[unit] = $NF }
            END {
              printf "- Geomean: **%s sec/op**\n", change["sec/op"]
              printf "- **%s B/op**\n", change["B/op"]
              printf "- **%s allocs/op**\n", change["allocs/op"]
            }
          ' benchmark-stat.txt > benchmark-summary.txt
          {
            echo '<!-- agent-marketplace-benchmark-results -->'
            echo '## Benchmark comparison'
            echo
            echo "Compared \`${BASE_SHA:0:12}\` (base) with \`${HEAD_SHA:0:12}\` (pull request) on the same runner."
            echo
            cat benchmark-summary.txt
            echo
            echo '<details><summary>Full benchstat output</summary>'
            echo
            head -n 400 benchmark-stat.txt | sed 's/^/    /'
            echo
            echo '</details>'
            echo
            echo '_Informational only; benchmark changes do not fail CI._'
          } > benchmark-comment.md
          cat benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Update pull request comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          marker='<!-- agent-marketplace-benchmark-results -->'
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))) | first | .id // empty")
          if [ -n "$comment_id" ]; then
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input -
          else
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.9.0
          install-only: true

      - name: Run linters
        run: make ci-lint

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run govulncheck
        uses: golang/govulncheck-action@032d45514ae346b1db93c04b0c90b841c370344f # v1.1.0
        with:
          go-version-file: go.mod
          go-version-input: ""
          repo-checkout: false

  web:
    name: Web checks
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: API contract drift
        run: pnpm run api:drift

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm run e2e:install

      - name: Browser E2E gate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH }}
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ vars.AGENT_BROWSER_EXECUTABLE_PATH }}
        run: pnpm run test:e2e

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, test, lint, govulncheck, marketplace-gate, web]
    if: startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build release artifacts
        run: make release

      - name: Upload release binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
          generate_release_notes: true
