name: Security race lane

# Dedicated branch-triggered race-detector lane for the issue 215 security
# stack. It executes the checked validation-contract race selections in
# scripts/security-race.sh on Ubuntu at the exact pushed revision with Go
# 1.26.10 and CGO_ENABLED=1, using synthetic fixtures and no production
# secrets. Every reviewed feature-branch push must keep durable evidence:
# the run URL, the exact commands, the pushed SHA, and the exit result. A
# run for another SHA, a skipped or cancelled job, or a failed command is
# not passing evidence.

on:
  push:
    branches:
      - 'fix/security-*'
  workflow_dispatch:

concurrency:
  # Never cancel an in-progress run: each pushed SHA owes its own completed
  # run as evidence, and a cancelled run blocks submission for that SHA.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract-race:
    name: Contract race selections
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout pushed revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            e2e/go.sum

      - name: Record toolchain identity
        shell: bash
        run: |
          set -euo pipefail
          go version | tee "$RUNNER_TEMP/go-version.txt"
          grep -q '^go version go1\.26\.10 linux/' "$RUNNER_TEMP/go-version.txt"

      - name: Run contract race selections
        shell: bash
        env:
          CGO_ENABLED: "1"
        run: scripts/security-race.sh
