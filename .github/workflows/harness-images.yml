name: Harness Images

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: harness-image-refresh
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Validate image metadata tooling
        run: go test ./tools/harness-compat
      - name: Select registered native harnesses
        id: matrix
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          matrix=$(go run ./tools/harness-compat matrix --native --repository "$REPOSITORY")
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  publish:
    name: Refresh ${{ matrix.target }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Prepare image diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/harness-image-artifacts"
          echo "HARNESS_COMPAT_REPORT_DIR=$RUNNER_TEMP/harness-image-artifacts" >> "$GITHUB_ENV"
      - name: Authenticate image publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build newest stable CLI and publish after offline startup verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HARNESS_COMPAT_REPORT_DIR"
          bash tools/harness-compat/build-image.sh "$TARGET" "$IMAGE" --push 2>&1 | tee "$HARNESS_COMPAT_REPORT_DIR/build.log"
      - name: Report image provenance
        if: always()
        shell: bash
        run: |
          {
            echo '## Daily harness image refresh'
            echo 'Newest stable releases are resolved at build time. Existing CI images remain available if refresh fails.'
            if [[ -f "$HARNESS_COMPAT_REPORT_DIR/image.json" ]]; then
              jq -r '.[0] | .Config.Labels as $l | "Image ID: \(.Id)\n\nCLI: \($l["io.agent-marketplace.target"]) \($l["org.opencontainers.image.version"])\n\nCreated: \($l["org.opencontainers.image.created"])\n\nSource revision: \($l["org.opencontainers.image.revision"])\n\nGo base: \($l["io.agent-marketplace.go-image"])\n\nNode base: \($l["io.agent-marketplace.node-image"])"' "$HARNESS_COMPAT_REPORT_DIR/image.json"
            else
              echo '**Image refresh failed before publication evidence was recorded. See the failing step and build artifact.**'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload image diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-image-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/harness-image-artifacts/
          if-no-files-found: warn
          retention-days: 7

  model-catalog-audit:
    name: Audit upstream model catalogs
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Prepare model audit diagnostics
        if: always()
        run: echo "AUDIT_REPORT_DIR=$RUNNER_TEMP/model-catalog-audit" >> "$GITHUB_ENV"
      - name: Verify offline audit contracts
        run: go test ./tools/model-catalog-audit -count=1
      - name: Audit public model evidence without modifying catalogs
        run: |
          set -euo pipefail
          mkdir -p "$AUDIT_REPORT_DIR"
          go run ./tools/model-catalog-audit check > "$AUDIT_REPORT_DIR/report.json" 2> "$AUDIT_REPORT_DIR/audit.log"
      - name: Publish model drift summary
        if: always()
        run: |
          set -euo pipefail
          if [[ -s "$AUDIT_REPORT_DIR/report.json" ]]; then
            go run ./tools/model-catalog-audit summary < "$AUDIT_REPORT_DIR/report.json" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Model catalog audit failed before producing evidence' >> "$GITHUB_STEP_SUMMARY"
            echo 'No freshness conclusion is available. Inspect the failed step and audit log.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload model audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: model-catalog-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/model-catalog-audit/
          if-no-files-found: warn
          retention-days: 14

  model-catalog-drift-pr:
    name: Propose model catalog drift PR
    needs: model-catalog-audit
    if: always() && needs.model-catalog-audit.result == 'failure' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Download model audit evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: model-catalog-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/model-catalog-audit
      - name: Propose model catalog drift updates
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
          REPORT_DIR: ${{ runner.temp }}/model-catalog-audit
        run: |
          set -euo pipefail
          report="$REPORT_DIR/report.json"
          body="$RUNNER_TEMP/pr-body.md"
          test_log="$RUNNER_TEMP/offline-catalog-tests.log"
          bot_email='41898282+github-actions[bot]@users.noreply.github.com'
          branch=automation/model-catalog-drift
          if [[ ! -s "$report" ]]; then
            echo '::notice::No model catalog audit report was produced; no drift proposal.'
            exit 0
          fi
          pr_number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          remote_sha=""
          if git fetch --quiet origin "$branch" 2>/dev/null; then
            remote_sha=$(git rev-parse FETCH_HEAD)
            if [[ "$(git log -1 --format='%ae %ce' FETCH_HEAD)" != "$bot_email $bot_email" ]]; then
              echo "::notice::A person has pushed to $branch; leaving the branch untouched."
              exit 0
            fi
          fi
          git switch -C "$branch"
          go run ./tools/model-catalog-audit propose < "$report" > "$body"
          if git diff --quiet -- pkg/harness-compilation/modelpolicy/catalogs; then
            if [[ -s "$body" ]]; then
              cat "$body" >> "$GITHUB_STEP_SUMMARY"
            fi
            echo '::notice::No catalog changes proposed; evidence drift and manual-entry candidates remain in the job summaries and audit artifact. No PR opened.'
            exit 0
          fi
          if go test ./pkg/harness-compilation/modelpolicy ./tools/model-catalog-audit -count=1 > "$test_log" 2>&1; then
            echo '' >> "$body"
            echo 'Offline catalog checks: passed' >> "$body"
          else
            {
              echo ''
              echo 'Offline catalog checks: failed'
              echo ''
              echo '<details><summary>Last 40 lines of go test output</summary>'
              echo ''
              echo '```text'
              tail -n 40 "$test_log" | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g'
              echo '```'
              echo ''
              echo '</details>'
            } >> "$body"
          fi
          git add pkg/harness-compilation/modelpolicy/catalogs
          git -c user.name='github-actions[bot]' -c user.email="$bot_email" commit -m "Propose model catalog drift updates from run $RUN_ID" -m "Spec-Impact: none — automated proposal for human review"
          if [[ -n "$remote_sha" ]] && git diff --quiet "$remote_sha" HEAD; then
            echo '::notice::Regenerated changes match the remote branch; refreshing the PR body without pushing.'
          else
            git push --force-with-lease="refs/heads/$branch:$remote_sha" origin "HEAD:refs/heads/$branch"
          fi
          if [[ -n "$pr_number" ]]; then
            gh pr edit "$pr_number" --body-file "$body"
          else
            gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Review upstream model catalog drift" --body-file "$body"
          fi

  verify:
    name: Check refreshed image compatibility
    needs: publish
    if: always() && needs.publish.result != 'skipped'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/harness-compatibility.yml
