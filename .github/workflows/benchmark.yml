name: Benchmark
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions: {}

env:
  CGO_ENABLED: "0"
jobs:
  changes:
    name: Benchmark Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      benchmark: ${{ steps.changes.outputs.benchmark }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Detect relevant changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git diff --no-renames --name-only -z "$BASE_SHA" "$HEAD_SHA" | go run ./tools/ci-plan >> "$GITHUB_OUTPUT"

  benchmark:
    name: Benchmark
    needs: changes
    if: github.event_name == 'pull_request' && (needs.changes.outputs.benchmark == 'true' || contains(github.event.pull_request.labels.*.name, 'run-benchmarks'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    env:
      BENCHMARK_PACKAGES: ./internal/resolver ./internal/materialize ./internal/tui ./internal/catalog ./internal/config ./cmd/agent-marketplace ./internal/cache ./pkg/harness-compilation ./internal/dependencytxn ./internal/lockfile ./internal/sourcerevision ./internal/pipeline ./internal/marketplace ./internal/marketplacelock
      BENCHMARK_PATTERN: ^Benchmark(ResolveDefaultAllLargeCatalog|RunDryRunLargeMixedResources|BuildRowsLargeMixed|LoadFSHCCIngest|MergeLayersLargeConfig|BuildListRows|GarbageCollectDryRun|MaterializeLargeArtifacts|CompileBundleLarge|SyncWarmUnchangedRemoteGitLock|SyncLocalGitDiskIONoNetwork|ResolveExactGitRef|CommitUnchanged|CheckPending|PlanUnchanged|Build|ProjectLockedRoots|LoadStableEffectiveIncludes|ExactGitGCDryRunFilesystem|MutableLocalGitBatchDiskIONoNetwork|VerifyExactGitTrackedTreeDiskNoNetwork|GitAuthEnvironment|ReadOnlyGitDocumentMatches|OrganizationIncludeTreeDiskReads|CaptureSnapshotTraversalDiskIO|CaptureAggregateDetailDiskIO|HookSupportFiles|DiscoverLegacyFallback|WarmConfiguredLegacyInstallDiskIO|ProvisionalManyMarketplaceSources|ApplySnapshotStatusWithoutPendingMutation|ResolveCachedNoFetch|MarketplaceInstallWarmRegistries|AliasedMarketplaceSkillDryRunDiskIONoNetwork|TUIStartupDiskIO|TUIToggleEditorAndReloadDiskIONoReconcile|TUIConfigTransactionDiskIONoNetwork|TUIMarketplaceBrowseWarmCacheDiskIONoNetwork|TUIStartupStages|RecomputeView|RenderBaseScreen)$
      BENCHSTAT_VERSION: v0.0.0-20260709024250-82a0b07e230d
      GOMAXPROCS: 2
    steps:
      - name: Checkout base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: benchmark-base
          persist-credentials: false

      - name: Checkout pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: benchmark-head
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: benchmark-head/go.mod
          cache-dependency-path: |
            benchmark-base/go.sum
            benchmark-head/go.sum

      - name: Install benchstat
        working-directory: benchmark-head
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install "golang.org/x/perf/cmd/benchstat@$BENCHSTAT_VERSION"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Select available benchmark packages
        run: |
          for checkout in base head; do
            packages=()
            for package in $BENCHMARK_PACKAGES; do
              if [ -d "benchmark-$checkout/$package" ]; then
                packages+=("$package")
              fi
            done
            echo "BENCHMARK_${checkout^^}_PACKAGES=${packages[*]}" >> "$GITHUB_ENV"
          done

      - name: Benchmark base
        working-directory: benchmark-base
        run: |
          # shellcheck disable=SC2086
          if ! go test -v -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_BASE_PACKAGES > "$GITHUB_WORKSPACE/benchmark-base.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-base.txt"
            exit 1
          fi

      - name: Benchmark pull request
        working-directory: benchmark-head
        run: |
          # shellcheck disable=SC2086
          if ! go test -v -p=1 -run '^$' -bench "$BENCHMARK_PATTERN" -benchtime=200ms -count=6 -benchmem $BENCHMARK_HEAD_PACKAGES > "$GITHUB_WORKSPACE/benchmark-head.txt"; then
            cat "$GITHUB_WORKSPACE/benchmark-head.txt"
            exit 1
          fi

      - name: Build benchmark report
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-base.txt > benchmark-base-clean.txt
          awk '/^(goos|goarch|pkg|cpu):/ || (/^Benchmark/ && $2 ~ /^[0-9]+$/)' benchmark-head.txt > benchmark-head-clean.txt
          benchstat -table '' benchmark-base-clean.txt benchmark-head-clean.txt | tee benchmark-stat.txt
          (cd benchmark-head && go run ./tools/benchmark-report ../benchmark-base-clean.txt ../benchmark-head-clean.txt) > benchmark-summary.txt
          {
            echo '<!-- agent-marketplace-benchmark-results -->'
            echo '## Benchmark comparison'
            echo
            echo "Compared \`${BASE_SHA:0:12}\` (base) with \`${HEAD_SHA:0:12}\` (pull request) on the same runner."
            echo
            cat benchmark-summary.txt
            echo
            echo '<details><summary>Workload notes</summary>'
            echo
            echo 'TUI startup measures 200 selected skills across three harnesses, including disk reads, exact-lock verification, drift checks, and rendering; fixtures begin without materialized output. Toggle transaction measures config/lock publication across four Git registries without sync or reload. Editor-and-reload measures 200 directory resources without dependency reconciliation. Marketplace browse measures 50 fresh disk-cached results, not installed-pin resolution or HTTP latency.'
            echo
            echo '</details>'
            echo
            echo "_Informational only; benchmark changes do not fail CI. Full benchstat output and profiles are in the [\`tui-performance-evidence\` artifact](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})._"
          } > benchmark-comment.md
          cat benchmark-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Profile TUI actions
        working-directory: benchmark-head
        run: |
          go test ./internal/tui -run '^$' -bench '^BenchmarkTUIStartupDiskIO$' -benchtime=2s -cpuprofile="$GITHUB_WORKSPACE/tui-startup-cpu.pprof" -memprofile="$GITHUB_WORKSPACE/tui-startup-heap.pprof" -trace="$GITHUB_WORKSPACE/tui-startup.trace" -o "$RUNNER_TEMP/tui-profile.test"
          go test ./cmd/agent-marketplace -run '^$' -bench '^BenchmarkTUIConfigTransactionDiskIONoNetwork$' -benchtime=2s -cpuprofile="$GITHUB_WORKSPACE/tui-toggle-cpu.pprof" -memprofile="$GITHUB_WORKSPACE/tui-toggle-heap.pprof" -trace="$GITHUB_WORKSPACE/tui-toggle.trace" -o "$RUNNER_TEMP/tui-toggle-profile.test"

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tui-performance-evidence
          path: |
            benchmark-*.txt
            benchmark-comment.md
            tui-*.pprof
            tui-*.trace
          retention-days: 14

      - name: Update pull request comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          marker='<!-- agent-marketplace-benchmark-results -->'
          comment_id=$(gh api "repos/$REPOSITORY/issues/$PR_NUMBER/comments?per_page=100" --jq "map(select(.user.login == \"github-actions[bot]\" and (.body | contains(\"$marker\")))) | first | .id // empty")
          if [ -n "$comment_id" ]; then
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" --input -
          else
            jq -n --rawfile body benchmark-comment.md '{body: $body}' | gh api --method POST "repos/$REPOSITORY/issues/$PR_NUMBER/comments" --input -
          fi
