name: Web

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: API contract drift
        run: pnpm run api:drift

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      # @playwright/test is blocked by the active pnpm supply-chain policy. Keep
      # browser E2E local and treat it as a release gate pending an approved dependency.
