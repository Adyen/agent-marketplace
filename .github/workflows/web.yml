name: Web

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:
    branches:
      - main

concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: Web checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable pnpm
          corepack install --global pnpm@11.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: API contract drift
        run: pnpm run api:drift

      - name: Check
        run: pnpm run check

      - name: Build
        run: pnpm run build

      - name: Install Chromium
        run: pnpm run e2e:install

      - name: Browser E2E gate
        env:
          PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: ${{ vars.PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH }}
          AGENT_BROWSER_EXECUTABLE_PATH: ${{ vars.AGENT_BROWSER_EXECUTABLE_PATH }}
        run: pnpm run test:e2e
