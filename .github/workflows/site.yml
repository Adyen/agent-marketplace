name: Website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'Makefile'
      - '.github/workflows/site.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'site/**'
      - 'Makefile'
      - '.github/workflows/site.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        run: |
          corepack enable pnpm
          corepack install --global pnpm@10.4.1

      - name: Build website
        run: make site-build
