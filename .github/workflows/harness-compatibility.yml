name: Harness Compatibility

on:
  pull_request: {}
  workflow_dispatch:
  workflow_call:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-compatibility
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Select every registered harness
        id: matrix
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          matrix=$(go run ./tools/harness-compat matrix --repository "$REPOSITORY")
          echo "value=$matrix" >> "$GITHUB_OUTPUT"

  contracts:
    name: Compiler and driver contracts (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
      - name: Verify compiler matrix, metadata, and reporting
        env:
          SKIP_MATRIX: '0'
        run: go test -count=1 ./pkg/harness-compilation/... ./tools/harness-compat
      - name: Verify isolated driver boundaries without vendor CLIs
        working-directory: e2e
        env:
          HARNESS_COMPAT_TARGET: ''
        run: go test -count=1 -run '^TestCompatibility' .
      - name: Validate image scripts
        run: shellcheck tools/harness-compat/*.sh

  probe:
    name: ${{ matrix.target }} compatibility (informational)
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      TARGET: ${{ matrix.target }}
      NATIVE_CLI: ${{ matrix.cli }}
      NATIVE_MODE: ${{ matrix.mode }}
      NATIVE_REASON: ${{ matrix.reason }}
      IMAGE: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            e2e/go.sum
      - name: Prepare offline test dependencies
        id: prepare
        run: |
          export HARNESS_COMPAT_REPORT_DIR="$RUNNER_TEMP/harness-compatibility-artifacts"
          echo "HARNESS_COMPAT_REPORT_DIR=$HARNESS_COMPAT_REPORT_DIR" >> "$GITHUB_ENV"
          mkdir -p "$HARNESS_COMPAT_REPORT_DIR"
          go mod download
      - name: Authenticate read-only image consumer
        if: matrix.mode == 'probe'
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Pull daily image and resolve its immutable identity
        id: published
        if: matrix.mode == 'probe'
        shell: bash
        run: |
          set -euo pipefail
          if docker pull --platform linux/amd64 "$IMAGE" > "$HARNESS_COMPAT_REPORT_DIR/pull.log" 2>&1; then
            docker image inspect "$IMAGE" > "$HARNESS_COMPAT_REPORT_DIR/image.json"
            recipe=$(sha256sum tools/harness-compat/Dockerfile tools/harness-compat/.dockerignore tools/harness-compat/install.sh tools/harness-compat/build-image.sh | sha256sum | cut -d ' ' -f 1)
            go_version=$(go list -m -f '{{.GoVersion}}')
            if jq -e --arg target "$TARGET" --arg recipe "$recipe" --arg go "$go_version" \
              '.[0].Config.Labels | .["io.agent-marketplace.target"] == $target and .["io.agent-marketplace.recipe-sha"] == $recipe and .["io.agent-marketplace.go-version"] == $go' \
              "$HARNESS_COMPAT_REPORT_DIR/image.json" >/dev/null; then
              echo 'available=true' >> "$GITHUB_OUTPUT"
              docker image inspect "$IMAGE" --format 'image_id={{.Id}}' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo '::notice::Image recipe or Go version changed; building an unpublished candidate for this run.'
          else
            echo '::warning::Published image unavailable; building an unpublished bootstrap image. See pull.log.'
          fi
          echo 'available=false' >> "$GITHUB_OUTPUT"
      - name: Bootstrap missing images or validate changed image recipes without publishing
        id: bootstrap
        if: matrix.mode == 'probe' && steps.published.outputs.available == 'false'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/harness-compat/build-image.sh "$TARGET" "$IMAGE" 2>&1 | tee "$HARNESS_COMPAT_REPORT_DIR/build.log"
      - name: Test native discovery offline or explicitly report blocked setup
        id: tests
        if: always() && steps.prepare.outcome == 'success'
        env:
          IMAGE_ID: ${{ steps.published.outputs.image_id || steps.bootstrap.outputs.image_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$NATIVE_MODE" == probe && -n "$IMAGE_ID" ]]; then
            version=$(docker image inspect "$IMAGE_ID" --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
            if [[ "$TARGET" == cursor ]]; then
              [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}-[a-f0-9]{7,40}$ ]]
            else
              [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+][A-Za-z0-9.-]+)?$ ]]
            fi
            docker run --rm --init --network none --cap-drop ALL \
              --security-opt no-new-privileges \
              --name "harness-compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET}" \
              --user "$(id -u):$(id -g)" \
              --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace" \
              --mount "type=bind,src=$(go env GOMODCACHE),dst=/go/pkg/mod,readonly" \
              --mount "type=bind,src=$HARNESS_COMPAT_REPORT_DIR,dst=/artifacts" \
              --workdir /workspace/e2e \
              --env HOME=/tmp/harness-runner --env GOPATH=/go \
              --env GOMODCACHE=/go/pkg/mod --env GOCACHE=/tmp/go-build \
              --env GOTOOLCHAIN=local --env CGO_ENABLED=0 \
              --env "HARNESS_COMPAT_TARGET=$TARGET" \
              --env HARNESS_COMPAT_NATIVE_MODE=probe \
              --env HARNESS_COMPAT_TRUST_FIXTURE=1 \
              --env "HARNESS_COMPAT_NATIVE_BINARY=/usr/local/bin/$NATIVE_CLI" \
              --env "HARNESS_COMPAT_NATIVE_VERSION=$version" \
              --env HARNESS_COMPAT_REPORT_DIR=/artifacts \
              "$IMAGE_ID" bash -c 'mkdir -p "$HOME"; go test -v -count=1 -timeout 15m -run "^TestHarnessCompatibility$" .' \
              2>&1 | tee "$HARNESS_COMPAT_REPORT_DIR/go-test.log"
          else
            if [[ "$NATIVE_MODE" == probe ]]; then
              NATIVE_MODE=blocked
              NATIVE_REASON='Native image setup failed; see image pull/build steps. Config checks do not certify native compatibility.'
            fi
            export HARNESS_COMPAT_TARGET="$TARGET" HARNESS_COMPAT_NATIVE_MODE="$NATIVE_MODE" HARNESS_COMPAT_NATIVE_REASON="$NATIVE_REASON"
            go -C e2e test -v -count=1 -timeout 15m -run '^TestHarnessCompatibility$' . 2>&1 | tee "$HARNESS_COMPAT_REPORT_DIR/go-test.log"
          fi
      - name: Stop any container left by cancellation or timeout
        if: always() && matrix.mode == 'probe'
        run: docker rm -f "harness-compat-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${TARGET}" >/dev/null 2>&1 || true
      - name: Publish coverage and image provenance
        if: always() && steps.prepare.outcome == 'success'
        env:
          IMAGE_ID: ${{ steps.published.outputs.image_id || steps.bootstrap.outputs.image_id }}
          PUBLISHED_AVAILABLE: ${{ steps.published.outputs.available }}
        shell: bash
        run: |
          set -euo pipefail
          source=config-only
          reference=''
          created=''
          if [[ -n "$IMAGE_ID" ]]; then
            source=bootstrap
            reference="$IMAGE_ID"
            if [[ "$PUBLISHED_AVAILABLE" == true ]]; then
              source=published
              reference=$(docker image inspect "$IMAGE_ID" --format '{{index .RepoDigests 0}}')
            fi
            created=$(docker image inspect "$IMAGE_ID" --format '{{index .Config.Labels "org.opencontainers.image.created"}}')
          fi
          go run ./tools/harness-compat summary \
            --report "$HARNESS_COMPAT_REPORT_DIR/compatibility-$TARGET.json" \
            --image "$reference" --created "$created" --source "$source" \
            | tee "$HARNESS_COMPAT_REPORT_DIR/summary.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: harness-compatibility-${{ matrix.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/harness-compatibility-artifacts/
          if-no-files-found: warn
          retention-days: 7
