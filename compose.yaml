name: agent-marketplace-sqlite

x-marketplace-platform: &marketplace-platform ${MARKETPLACE_PLATFORM:-}
x-marketplace-build-args: &marketplace-build-args
  GO_BUILD_IMAGE: ${GO_BUILD_IMAGE:-golang:1.26.6-bookworm}
  RUNTIME_IMAGE: ${RUNTIME_IMAGE:-gcr.io/distroless/static-debian12:nonroot}

services:
  # SQLite is intentionally all-in-one: one process owns the database handle,
  # API listener, and refresh worker. Do not split API and worker across
  # containers unless the metadata store is changed to PostgreSQL.
  app:
    platform: *marketplace-platform
    build:
      context: .
      dockerfile: Dockerfile.marketplace
      target: worker
      args:
        <<: *marketplace-build-args
        VERSION: ${MARKETPLACE_VERSION:-dev}
    command: ["serve", "--config", "/app/marketplace.yaml", "--role", "all"]
    volumes:
      - ./deploy/compose/sqlite-filesystem/config.yaml:/app/marketplace.yaml:ro
      - marketplace-data:/var/lib/agent-marketplace
    read_only: true
    tmpfs:
      - /tmp:exec,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/app/marketplace-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    platform: *marketplace-platform
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
    environment:
      NUXT_PUBLIC_API_BASE: /
      NUXT_API_BASE_INTERNAL: http://app:8080
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - "3000"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  proxy:
    platform: *marketplace-platform
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${MARKETPLACE_HTTP_PORT:-8080}:8080"
    volumes:
      - ./deploy/compose/sqlite-filesystem/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/compose/sqlite-filesystem/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  marketplace-data:
