language: en-US
reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    labels: []
    base_branches:
      - main
    ignore_title_keywords:
      - WIP
      - DO NOT REVIEW
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 10
  tools:
    golangci-lint:
      enabled: true
  path_filters:
    - "!dist/**"
    - "!.idea/**"
    - "!.agents/skills/**"
  path_instructions:
    - path: "**/*"
      instructions: |
        Compatibility: prioritize every user-facing change, including changes behind internal helpers. Trace affected consumer paths and compare the before/after contract against openspec/specs/; where no spec covers it, use existing code and tests. Check public HTTP and Go APIs, CLI commands/flags/defaults, machine-readable output/exit codes/diagnostic codes, config and lock formats, generated harness artifacts, and supported CLI/TUI/web workflows.
        For each suspected break, identify the affected interface, a concrete previously supported input or workflow, the changed outcome, and impacted users or clients. Distinguish confirmed incompatibilities from compatible additions and contract-preserving refactors; state missing evidence as a review gap.
        For every confirmed break, raise a prominent review finding and state: "This breaking user-facing contract change requires a new major version release." Include each break and its release impact in the high-level summary. Treat an unintended break as a regression to fix; an intentional break needs an explicit major-release plan, updated spec, migration guidance, and release notes.
        Thoroughly review each affected consumer path, failure behavior, and persisted-data compatibility. Require regression tests through the actual consumer, including existing configs/locks and mixed-version clients where relevant. Report missing coverage, migration risks, and any patch/minor release plan that conflicts with a confirmed break. A version bump alone is insufficient evidence of a safe migration.
    - path: "**/*.go"
      instructions: |
        This repository is a Go CLI. Review for deterministic behavior, explicit errors with context, safe filesystem operations, and idiomatic Go 1.27 code. Prefer simple standard-library solutions. Do not suggest comments unless the code is genuinely unclear or documenting an exported API.
    - path: "cmd/agent-marketplace/**/*.go"
      instructions: |
        Review CLI behavior from the user's perspective. Validate Cobra argument/flag combinations, scope handling, stdout/stderr behavior, and error messages. Commands that mutate config or symlinks must remain idempotent and should not partially apply changes without returning a useful error.
    - path: "internal/config/**/*.go"
      instructions: |
        This package owns layered config semantics. Preserve precedence order, source stamping, inherited list behavior where specific registry entries win over top-level defaults, local-path registry detection, and validation rules. Required registries must remain immune to excludes.
    - path: "internal/resolver/**/*.go"
      instructions: |
        This package is policy-critical. Check selection, excludes, required/default handling, local overrides, collections, name-collision detection, and deterministic ordering. Be strict about regressions that could silently enable, disable, or overwrite skills.
    - path: "internal/materialize/**/*.go"
      instructions: |
        This package mutates symlinks under repo and user skill directories and performs drift detection. Review for symlink safety, preservation of non-symlink files, orphan cleanup correctness, deterministic results, and clear error aggregation. Drift detection must be read-only and accurately distinguish missing links, wrong targets, dead links, orphaned links, and stale caches. Review relative symlink target resolution and repo-vs-global scope classification carefully.
    - path: "internal/cache/**/*.go"
      instructions: |
        This package shells out to git and manages cached registry clones. Review command construction, stale-cache fallback behavior, ref checkout/reset safety, path handling, and error messages. Do not suggest logging registry contents or secrets.

    - path: "internal/collection/**/*.go"
      instructions: |
        Collections expand into concrete skills. Review cycle handling, missing member reporting, deterministic ordering, and preservation of collection provenance so remove/exclude behavior remains correct.
    - path: "internal/tui/**/*.go"
      instructions: |
        The TUI uses Bubble Tea. Review state transitions, key handling, terminal-safe rendering, async command effects, and consistency with non-interactive CLI behavior. Watch for changes that make tests flaky or depend on terminal dimensions without guards.
    - path: "**/*_test.go"
      instructions: |
        Tests should isolate HOME, repository roots, git remotes, cache directories, and filesystem state with temporary directories. Prefer table-driven tests for policy matrices. Changes to hot paths such as sync, status, Resolve, DiscoverSkills, and collection expansion should keep or add benchmarks when performance is affected.
    - path: "Makefile"
      instructions: |
        Keep CI-friendly targets deterministic. The quality gates are make ci-lint, make test, and make build. Do not recommend targets that require unavailable local tools unless gracefully optional.
chat:
  auto_reply: true
