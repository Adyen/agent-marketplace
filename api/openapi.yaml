openapi: 3.0.3
info:
  title: agent-marketplace API
  version: 1.0.0
  description: |
    Public API for discovering, listing, and acquiring agent resources from an
    agent-marketplace instance.

servers:
  - url: /api/v1
    description: Marketplace API v1

paths:
  /.well-known/agent-marketplace.json:
    get:
      operationId: getWellKnown
      summary: Marketplace instance metadata and capabilities
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Marketplace capabilities
      responses:
        "200":
          description: Capability block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Marketplace instance metadata
      responses:
        "200":
          description: Marketplace instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marketplace"

  /api/v1/search:
    get:
      operationId: searchResources
      summary: Search selectable resources
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: query
          name: source
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated resource search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /api/v1/sources/{source}:
    get:
      operationId: getSource
      summary: Get a source by slug or ID
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /api/v1/sources/{source}/history:
    get:
      operationId: getSourceHistory
      summary: Get source revision history
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source occurrence history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SourceOccurrence"

  /api/v1/resources/{source}/{kind}/{name}:
    get:
      operationId: getResource
      summary: Get the latest resource revision
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{source}/{kind}/{name}/revisions:
    get:
      operationId: listResourceRevisions
      summary: List all resource revisions
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{source}/{kind}/{name}/revisions/{revision}:
    get:
      operationId: getResourceRevision
      summary: Get a specific resource revision
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          schema:
            type: string
        - in: path
          name: revision
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/manifests/{source-revision}:
    get:
      operationId: getManifest
      summary: Download a source revision manifest
      parameters:
        - in: path
          name: source-revision
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Source revision manifest JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/artifacts/sha256/{digest}:
    get:
      operationId: getArtifact
      summary: Download a canonical artifact by digest
      parameters:
        - in: path
          name: digest
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Canonical artifact tar.gz
          content:
            application/vnd.agent-marketplace.artifact.v1.tar+gzip:
              schema:
                type: string
                format: binary

  /s/{source}/{kind}/{name}:
    get:
      operationId: getBrowserResource
      summary: Stable browser route for a resource
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Liveness response

components:
  schemas:
    Capabilities:
      type: object
      required:
        - api_versions
        - artifact_schema_versions
        - resource_kinds
        - acquisition_modes
        - features
      properties:
        api_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        artifact_schema_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        resource_kinds:
          type: array
          items:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        acquisition_modes:
          type: array
          items:
            type: string
            enum:
              - index-only
              - mirror
        features:
          type: array
          items:
            type: string

    WellKnown:
      allOf:
        - $ref: "#/components/schemas/Capabilities"
        - type: object
          required:
            - instance_id
            - canonical_url
            - api_base
            - browser_route_template
          properties:
            instance_id:
              type: string
            canonical_url:
              type: string
              format: uri
            api_base:
              type: string
            browser_route_template:
              type: string

    Marketplace:
      type: object
      required:
        - id
        - name
        - canonical_url
      properties:
        id:
          type: string
        name:
          type: string
        canonical_url:
          type: string
          format: uri
        instance_metadata:
          type: object
          additionalProperties: true

    Source:
      type: object
      required:
        - id
        - slug
        - ref
        - origins
        - acquisition
        - roots
        - listed
      properties:
        id:
          type: string
        slug:
          type: string
        aliases:
          type: array
          items:
            type: string
        origins:
          type: array
          items:
            type: string
        ref:
          type: string
        roots:
          type: array
          items:
            type: object
        acquisition:
          type: string
          enum:
            - index-only
            - mirror
        listed:
          type: boolean

    SourceOccurrence:
      type: object
      required:
        - source_id
        - ref
        - revision_commit
        - source_revision_manifest_digest
        - acquisition
        - occurred_at
      properties:
        source_id:
          type: string
        ref:
          type: string
        revision_commit:
          type: string
        source_revision_manifest_digest:
          type: string
        acquisition:
          type: string
        mirrored_artifact_digest:
          type: string
        occurred_at:
          type: string
          format: date-time

    SearchResult:
      type: object
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceListItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    ResourceListItem:
      type: object
      required:
        - source_id
        - kind
        - name
        - revision
        - content_digest
      properties:
        source_id:
          type: string
        source_slug:
          type: string
        kind:
          type: string
          enum:
            - skill
            - command
            - subagent
            - hook
            - mcpserver
            - collection
        name:
          type: string
        revision:
          type: string
        content_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        score:
          type: number
          description: Server-assigned relevance score for the query.

    ResourceRevision:
      type: object
      required:
        - coordinate
        - content_digest
      properties:
        coordinate:
          type: object
          properties:
            marketplace:
              type: string
            source:
              type: string
            kind:
              type: string
            name:
              type: string
        content_digest:
          type: string
        archive_digest:
          type: string
        analyzer_version:
          type: string
        findings:
          type: array
          items:
            type: object
        license:
          type: string
        provenance:
          type: object
        revocation:
          type: object
