openapi: 3.0.3
info:
  title: agent-marketplace API
  version: 1.0.0
  description: |
    Public API for discovering, listing, and acquiring agent resources from an
    agent-marketplace instance.

servers:
  # Paths below are absolute from the public origin. Keeping the server at the
  # origin prevents /api/v1 from being prepended to well-known, browser, health,
  # and already-versioned API paths.
  - url: /
    description: Marketplace public origin

paths:
  /.well-known/agent-marketplace.json:
    get:
      operationId: getWellKnown
      summary: Marketplace instance metadata and capabilities
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Marketplace capabilities
      responses:
        "200":
          description: Capability block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Marketplace instance metadata
      responses:
        "200":
          description: Marketplace instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marketplace"

  /api/v1/search:
    get:
      operationId: searchResources
      summary: Search selectable resources
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: query
          name: source
          schema:
            type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated resource search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /api/v1/sources/{source}:
    get:
      operationId: getSource
      summary: Get a source by slug or ID
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Source details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Source"

  /api/v1/sources/{source}/occurrences/{commit}:
    get:
      operationId: getSourceOccurrence
      summary: Get one exact source occurrence
      parameters:
        - in: path
          name: source
          required: true
          schema:
            type: string
        - in: path
          name: commit
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}$"
      responses:
        "200":
          description: Exact source occurrence and current approved acquisition origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExactSourceOccurrence"

  /api/v1/sources/{source}/history:
    get:
      operationId: getSourceHistory
      summary: Get source revision history
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Source occurrence history, newest first. The server returns at most 1000 entries and returns [] when no history exists.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/SourceOccurrence"

  /api/v1/resources/{source}/{kind}/{name}:
    get:
      operationId: getResource
      summary: Get the latest resource revision
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe source-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{source}/{kind}/{name}/revisions:
    get:
      operationId: listResourceRevisions
      summary: List all resource revisions
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe source-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Resource revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{source}/{kind}/{name}/revisions/{revision}:
    get:
      operationId: getResourceRevision
      summary: Get a specific resource revision
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe source-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: revision
          required: true
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/manifests/{source-revision}:
    get:
      operationId: getManifest
      summary: Download a content-addressed source or collection manifest
      parameters:
        - in: path
          name: source-revision
          required: true
          description: Canonical source manifest digest.
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      responses:
        "200":
          description: Source revision manifest JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/artifacts/sha256/{digest}:
    get:
      operationId: getArtifact
      summary: Download a canonical artifact by digest
      parameters:
        - in: path
          name: digest
          required: true
          description: Exactly 64 lowercase hexadecimal characters (the sha256 prefix is part of the path).
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Canonical artifact tar.gz
          content:
            application/vnd.agent-marketplace.artifact.v1.tar+gzip:
              schema:
                type: string
                format: binary

  /s/{source}/{kind}/{name}:
    get:
      operationId: getBrowserResource
      summary: Stable browser route for a resource
      parameters:
        - in: path
          name: source
          required: true
          description: Route-safe source slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe source-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Liveness response

components:
  schemas:
    Capabilities:
      type: object
      required:
        - api_versions
        - artifact_schema_versions
        - resource_kinds
        - acquisition_modes
        - features
      properties:
        api_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        artifact_schema_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        resource_kinds:
          type: array
          items:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        acquisition_modes:
          type: array
          items:
            type: string
            enum:
              - index-only
              - mirror
        features:
          type: array
          items:
            type: string

    WellKnown:
      allOf:
        - $ref: "#/components/schemas/Capabilities"
        - type: object
          required:
            - instance_id
            - canonical_url
            - api_base
            - browser_route_template
          properties:
            instance_id:
              type: string
            canonical_url:
              type: string
              format: uri
              description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.
            api_base:
              type: string
            browser_route_template:
              type: string

    Marketplace:
      type: object
      required:
        - id
        - name
        - canonical_url
      properties:
        id:
          type: string
        name:
          type: string
        canonical_url:
          type: string
          format: uri
          description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.
        instance_metadata:
          type: object
          additionalProperties: true

    Source:
      type: object
      additionalProperties: false
      description: Public source metadata. Origins are sanitized to remove URL userinfo, fragments, and credential/signature-like query values; credentials, policy internals, and refresh diagnostics are never returned.
      required:
        - id
        - slug
        - ref
        - origins
        - acquisition
        - roots
        - listed
      properties:
        id:
          type: string
        slug:
          type: string
        aliases:
          type: array
          items:
            type: string
        origins:
          type: array
          description: Current and historical origins with URL userinfo removed and credential/signature-like query values redacted.
          items:
            type: string
        ref:
          type: string
        roots:
          type: array
          items:
            $ref: "#/components/schemas/SourceRoot"
        acquisition:
          type: string
          enum:
            - index-only
            - mirror
        publisher:
          $ref: "#/components/schemas/Publisher"
        license:
          type: string
        listed:
          type: boolean

    SourceRoot:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        source_harness:
          type: string

    Publisher:
      type: object
      description: Public publisher metadata; unsafe legacy URLs are omitted.
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.

    SourceOccurrence:
      type: object
      additionalProperties: false
      description: Immutable source observation with an exact source commit and canonical SHA-256 digests.
      required:
        - source_id
        - ref
        - commit
        - source_revision_manifest_digest
        - acquisition
        - occurred_at
      properties:
        source_id:
          type: string
        ref:
          type: string
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact full-length lowercase Git commit identifier.
        source_revision_manifest_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        acquisition:
          type: string
          enum:
            - index-only
            - mirror
        mirrored_artifact_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        occurred_at:
          type: string
          format: date-time

    ExactSourceOccurrence:
      type: object
      additionalProperties: false
      description: Exact source occurrence plus the current operator-approved acquisition origin.
      required:
        - source_id
        - ref
        - commit
        - source_revision_manifest_digest
        - acquisition
        - acquisition_origin
        - occurred_at
      properties:
        source_id:
          type: string
        ref:
          type: string
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
        source_revision_manifest_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        acquisition:
          type: string
          enum: [index-only, mirror]
        acquisition_origin:
          type: string
        occurred_at:
          type: string
          format: date-time

    SearchResult:
      type: object
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceListItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    ResourceListItem:
      type: object
      required:
        - source_id
        - kind
        - name
        - revision
        - content_digest
      properties:
        source_id:
          type: string
        source_slug:
          type: string
        kind:
          type: string
          enum:
            - skill
            - command
            - subagent
            - hook
            - mcpserver
            - collection
        name:
          type: string
        revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        content_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        description:
          type: string
        metadata:
          type: object
          additionalProperties:
            type: string
        score:
          type: number
          description: Server-assigned relevance score for the query.

    ResourceRevision:
      type: object
      required:
        - coordinate
        - content_digest
      properties:
        coordinate:
          type: object
          required:
            - marketplace
            - source
            - kind
            - name
          properties:
            marketplace:
              type: string
            source:
              type: string
            kind:
              type: string
              enum:
                - skill
                - command
                - subagent
                - hook
                - mcpserver
                - collection
            name:
              type: string
        content_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        archive_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        analyzer_version:
          type: string
        findings:
          type: array
          items:
            type: object
            additionalProperties: true
        license:
          type: string
        provenance:
          type: object
          additionalProperties: true
        revocation:
          type: object
          additionalProperties: true
