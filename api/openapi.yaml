openapi: 3.0.3
info:
  title: agent-marketplace API
  version: 1.0.0
  description: |
    Public API for discovering, listing, and acquiring agent resources from an
    agent-marketplace instance.

servers:
  # Paths below are absolute from the public origin. Keeping the server at the
  # origin prevents /api/v1 from being prepended to well-known, browser, health,
  # and already-versioned API paths.
  - url: /
    description: Marketplace public origin

paths:
  /api/v1/admin/session:
    get:
      operationId: getAdminSession
      summary: Trusted proxy authenticated admin session (never cache)
      responses:
        '200':
          description: Authenticated session; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminSession'
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/configuration:
    get:
      operationId: getAdminConfiguration
      responses:
        '200':
          description: Managed configuration; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminConfiguration'
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/profiles:
    get:
      operationId: getAdminProfiles
      responses:
        '200':
          description: Opaque approved references only; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfiles'
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/instance:
    get:
      operationId: getAdminInstance
      responses:
        '200':
          description: Sanitized deployment information; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminInstance'
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/attempts:
    get:
      operationId: getAdminAttempts
      parameters:
        - in: query
          name: before
          schema: { type: integer, format: int64, minimum: 0 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
        - in: query
          name: registry_id
          schema: { type: string }
        - in: query
          name: job_id
          schema: { type: string }
      responses:
        '200':
          description: Bounded refresh attempt history; no-store. A nonzero next_before is the cursor for an older page, which may be empty.
          content:
            application/json:
              schema:
                type: object
                required: [attempts, next_before]
                properties:
                  attempts:
                    type: array
                    items: { $ref: '#/components/schemas/AdminAttempt' }
                  next_before: { type: integer, format: int64 }
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/activity:
    get:
      operationId: getAdminActivity
      parameters:
        - in: query
          name: before
          schema: { type: integer, format: int64 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100 }
      responses:
        '200':
          description: Append-only changes; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [changes]
                properties:
                  changes:
                    type: array
                    items: { $ref: '#/components/schemas/AdminChange' }
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/jobs/{id}:
    get:
      operationId: getAdminJob
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Safe job status without payloads or raw logs; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminJob'
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/validate:
    post:
      operationId: validateAdminChange
      description: Static validation only; does not acquire a repository or publish. Requires browser same-origin protection.
      parameters:
        - $ref: '#/components/parameters/AdminRevision'
        - $ref: '#/components/parameters/AdminMarker'
        - $ref: '#/components/parameters/AdminIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProposal' }
      responses:
        '200':
          description: Statically valid proposal; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                required: [valid, warnings]
                properties:
                  valid: { type: boolean, enum: [true] }
                  warnings:
                    type: array
                    items: { type: string }
        default:
          $ref: '#/components/responses/AdminError'
  /api/v1/admin/changes:
    post:
      operationId: applyAdminChange
      description: Atomic audited change and durable work intent. Acceptance does not imply publication. Never automatically replay after session expiry or conflict.
      parameters:
        - $ref: '#/components/parameters/AdminRevision'
        - $ref: '#/components/parameters/AdminMarker'
        - $ref: '#/components/parameters/AdminIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminProposal' }
      responses:
        '202':
          description: Accepted configuration or operational request; Cache-Control no-store
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminChange' }
        default:
          $ref: '#/components/responses/AdminError'
  /.well-known/agent-marketplace.json:
    get:
      operationId: getWellKnown
      summary: Marketplace instance metadata and capabilities
      responses:
        "200":
          description: Instance metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WellKnown"

  /api/v1/capabilities:
    get:
      operationId: getCapabilities
      summary: Marketplace capabilities
      responses:
        "200":
          description: Capability block
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"

  /api/v1/catalog:
    get:
      operationId: listCatalogProjection
      summary: List the current catalog projection
      description: >-
        Returns a stateless, bounded keyset page ordered by immutable resource
        coordinate. Start a scan without `after`; continue with the opaque
        `next_cursor` until `complete` is true. The scan is eventually
        consistent rather than snapshot-consistent: consumers compare the
        global ETag on the first and final pages and schedule a catch-up scan
        when it changes. `If-None-Match` is accepted only on a first-page
        request without `after`; continuation pages use only their cursor.
      parameters:
        - in: query
          name: after
          description: Opaque keyset cursor from the preceding page. Clients must not inspect or construct this value.
          schema:
            $ref: "#/components/schemas/CatalogKeysetCursor"
        - in: query
          name: limit
          description: Maximum number of resource rows to return.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - in: header
          name: If-None-Match
          description: HTTP If-None-Match value from the consumer's last completed ingestion. Accepted only on the first page, when `after` is absent.
          schema:
            $ref: "#/components/schemas/CatalogIfNoneMatch"
      responses:
        "200":
          description: Current catalog projection page
          headers:
            ETag:
              description: Strong quoted validator for all catalog-visible current state, including changes outside this page.
              schema:
                $ref: "#/components/schemas/CatalogETag"
            Cache-Control:
              description: Catalog pages are revalidated before reuse.
              schema:
                type: string
                enum: [no-cache]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        "304":
          description: Catalog-visible state is unchanged since the supplied first-page If-None-Match validator. The response has no body.
          headers:
            ETag:
              description: Strong quoted validator for all catalog-visible current state.
              schema:
                $ref: "#/components/schemas/CatalogETag"
            Cache-Control:
              description: Catalog pages are revalidated before reuse.
              schema:
                type: string
                enum: [no-cache]

  /api/v1/instance:
    get:
      operationId: getInstance
      summary: Marketplace instance metadata
      responses:
        "200":
          description: Marketplace instance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Marketplace"

  /api/v1/search:
    get:
      operationId: searchResources
      summary: Search selectable resources
      parameters:
        - in: query
          name: kind
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: query
          name: registry
          style: form
          explode: true
          schema:
            type: array
            items:
              type: string
        - in: query
          name: q
          schema:
            type: string
        - in: query
          name: limit
          schema:
            type: integer
            default: 100
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Paginated resource search results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"

  /api/v1/registries:
    get:
      operationId: listRegistries
      summary: List registry identifiers for discovery filters
      responses:
        "200":
          description: Registry identifiers sorted by slug
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/RegistrySummary"

  /api/v1/registries/{registry}:
    get:
      operationId: getRegistry
      summary: Get a registry by slug or ID
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Registry details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"

  /api/v1/registries/{registry}/occurrences/{commit}:
    get:
      operationId: getRegistryOccurrence
      summary: Get one exact registry occurrence
      parameters:
        - in: path
          name: registry
          required: true
          schema:
            type: string
        - in: path
          name: commit
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{40}$"
      responses:
        "200":
          description: Exact registry occurrence and current approved acquisition origin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExactRegistryOccurrence"

  /api/v1/registries/{registry}/history:
    get:
      operationId: getRegistryHistory
      summary: Get registry revision history
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Registry occurrence history, newest first. The server returns at most 1000 entries and returns [] when no history exists.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: "#/components/schemas/RegistryOccurrence"

  /api/v1/resources/{registry}/{kind}/{name}:
    get:
      operationId: getResource
      summary: Get the latest resource revision
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe registry-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{registry}/{kind}/{name}/revisions:
    get:
      operationId: listResourceRevisions
      summary: List all resource revisions
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe registry-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: Resource revisions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceRevision"

  /api/v1/resources/{registry}/{kind}/{name}/revisions/{revision}:
    get:
      operationId: getResourceRevision
      summary: Get a specific resource revision
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID; slashes are not accepted because the Go router cannot safely distinguish encoded slashes.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        - in: path
          name: name
          required: true
          description: Route-safe registry-local name; slashes are not accepted because the Go router treats them as path separators.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: revision
          required: true
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      responses:
        "200":
          description: Resource revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceRevision"

  /api/v1/manifests/{registry-revision}:
    get:
      operationId: getManifest
      summary: Download a content-addressed registry or collection manifest
      parameters:
        - in: path
          name: registry-revision
          required: true
          description: Canonical registry manifest digest.
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      responses:
        "200":
          description: Registry revision manifest JSON
          content:
            application/json:
              schema:
                type: object

  /api/v1/assessments/sha256/{digest}:
    get:
      operationId: getResourceAssessment
      summary: Get an immutable resource assessment by digest
      parameters:
        - in: path
          name: digest
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Immutable analyzer-independent resource assessment
          headers:
            Cache-Control:
              schema: { type: string }
              description: public, max-age=31536000, immutable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceAssessment"
        "400": { description: Invalid assessment digest path }
        "404": { description: Assessment not found }

  /api/v1/inspection/sha256/{digest}:
    get:
      operationId: getInspectionManifest
      summary: Download an immutable inspection manifest by digest
      parameters:
        - in: path
          name: digest
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Immutable inspection manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionManifest"

  /api/v1/content/sha256/{digest}:
    get:
      operationId: getInspectionContent
      summary: Download an allowlisted inspection file by digest
      parameters:
        - in: path
          name: digest
          required: true
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Bounded text or permitted raster content
          content:
            text/markdown:
              schema: { type: string }
            text/plain:
              schema: { type: string }
            application/json:
              schema: { type: string }
            application/yaml:
              schema: { type: string }
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }

  /api/v1/resources/{registry}/{kind}/{name}/revisions/{revision}/inspection:
    get:
      operationId: getResourceInspection
      summary: Get the exact immutable inspection manifest
      parameters:
        - { in: path, name: registry, required: true, schema: { type: string } }
        - { in: path, name: kind, required: true, schema: { type: string, enum: [skill, command, subagent, hook, mcpserver, collection] } }
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: path, name: revision, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Exact immutable inspection projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionManifest"

  /api/v1/resources/{registry}/{kind}/{name}/revisions/{revision}/inspection/content:
    get:
      operationId: getResourceInspectionContent
      summary: Get the primary canonical inspection content
      parameters:
        - { in: path, name: registry, required: true, schema: { type: string } }
        - { in: path, name: kind, required: true, schema: { type: string, enum: [skill, command, subagent, hook, mcpserver, collection] } }
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: path, name: revision, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Canonical inspection content
          content:
            text/markdown: { schema: { type: string } }
            text/plain: { schema: { type: string } }
            application/json: { schema: { type: string } }
            application/yaml: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }

  /api/v1/resources/{registry}/{kind}/{name}/revisions/{revision}/inspection/content/{digest}:
    get:
      operationId: getResourceInspectionFile
      summary: Get one allowlisted inspection file by digest
      parameters:
        - { in: path, name: registry, required: true, schema: { type: string } }
        - { in: path, name: kind, required: true, schema: { type: string, enum: [skill, command, subagent, hook, mcpserver, collection] } }
        - { in: path, name: name, required: true, schema: { type: string } }
        - { in: path, name: revision, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
        - { in: path, name: digest, required: true, schema: { type: string, pattern: "^sha256:[0-9a-f]{64}$" } }
      responses:
        "200":
          description: Allowlisted inspection file
          content:
            text/markdown: { schema: { type: string } }
            text/plain: { schema: { type: string } }
            application/json: { schema: { type: string } }
            application/yaml: { schema: { type: string } }
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }

  /api/v1/artifacts/sha256/{digest}:
    get:
      operationId: getArtifact
      summary: Download a canonical artifact by digest
      parameters:
        - in: path
          name: digest
          required: true
          description: Exactly 64 lowercase hexadecimal characters (the sha256 prefix is part of the path).
          schema:
            type: string
            pattern: "^[0-9a-f]{64}$"
      responses:
        "200":
          description: Canonical artifact tar.gz
          content:
            application/vnd.agent-marketplace.artifact.v1.tar+gzip:
              schema:
                type: string
                format: binary

  /r/{registry}/{kind}/{name}:
    get:
      operationId: getBrowserResourceLatest
      summary: Stable Nuxt-owned browser route for the latest resource revision
      description: This HTML route is served by the separate Nuxt frontend. The API service alone returns 404.
      parameters:
        - in: path
          name: registry
          required: true
          description: Route-safe registry slug or ID.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [skill, command, subagent, hook, mcpserver, collection]
        - in: path
          name: name
          required: true
          description: Route-safe registry-local name.
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
      responses:
        "200":
          description: HTML latest-revision browser page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Browser frontend is not deployed or the resource is unavailable

  /r/{registry}/{kind}/{name}/revisions/{revision}:
    get:
      operationId: getBrowserResourceRevision
      summary: Stable Nuxt-owned browser route for an exact resource revision
      description: This immutable HTML route is served by the separate Nuxt frontend. The API service alone returns 404.
      parameters:
        - in: path
          name: registry
          required: true
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: kind
          required: true
          schema:
            type: string
            enum: [skill, command, subagent, hook, mcpserver, collection]
        - in: path
          name: name
          required: true
          schema:
            type: string
            pattern: "^(?:[A-Za-z0-9]|[A-Za-z0-9][A-Za-z0-9._:@+~ -]{0,254}[A-Za-z0-9._:@+~-])$"
        - in: path
          name: revision
          required: true
          schema:
            type: string
            pattern: "^sha256:[0-9a-f]{64}$"
      responses:
        "200":
          description: HTML exact-revision browser page
          content:
            text/html:
              schema:
                type: string
        "404":
          description: Browser frontend is not deployed or the revision is unavailable

  /healthz:
    get:
      operationId: getHealthz
      summary: Liveness probe
      responses:
        "200":
          description: Liveness response

components:
  parameters:
    AdminRevision:
      in: header
      name: If-Match
      required: true
      description: Quoted managed revision read from configuration
      schema: { type: string, example: '"18"' }
    AdminMarker:
      in: header
      name: X-Marketplace-Admin
      required: true
      schema: { type: string, enum: ['1'] }
    AdminIdempotency:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, format: uuid }
  responses:
    AdminError:
      description: 'Stable error; no-store. 401 unauthenticated, 403 forbidden, 428 precondition_required, 409 revision_conflict or idempotency_conflict, 422 invalid_configuration.'
      content:
        application/json:
          schema:
            type: object
            required: [code, message]
            properties:
              code: { type: string }
              message: { type: string }
              fields:
                type: object
                additionalProperties: { type: string }
  schemas:
    AdminActor:
      type: object
      required: [issuer, subject]
      properties:
        issuer: { type: string }
        subject: { type: string }
    AdminSession:
      type: object
      required: [actor, capabilities]
      properties:
        actor: { $ref: '#/components/schemas/AdminActor' }
        capabilities:
          type: array
          items: { type: string }
    AdminLicensePolicy:
      type: object
      required: [allowlist, undeclared]
      properties:
        allowlist:
          type: array
          nullable: true
          items: { type: string }
        undeclared: { type: string, enum: [reject, warn, allow, ''] }
    AdminRegistry:
      type: object
      required: [id, slug, aliases, origin, historical_origins, ref, roots, acquisition, publisher, license, generation, lifecycle, paused, withdrawn, retired]
      properties:
        paused: { type: boolean }
        withdrawn: { type: boolean }
        retired: { type: boolean }
        id: { type: string }
        slug: { type: string }
        aliases:
          type: array
          nullable: true
          items: { type: string }
        origin: { type: string }
        historical_origins:
          type: array
          nullable: true
          items: { type: string }
        ref: { type: string }
        roots:
          type: array
          nullable: true
          items:
            type: object
            required: [path]
            properties:
              path: { type: string }
              source_harness: { type: string }
        acquisition: { type: string, enum: [index-only, mirror] }
        publisher:
          type: object
          properties:
            name: { type: string }
            url: { type: string }
        license: { type: string }
        profile_id: { type: string }
        license_override: { $ref: '#/components/schemas/AdminLicensePolicy' }
        non_license_overrides:
          type: object
          additionalProperties: true
        generation: { type: integer, format: int64 }
        lifecycle: { type: string }
    AdminSnapshot:
      type: object
      required: [version, policy_revision, license_policy, registries, source_fingerprint]
      properties:
        version: { type: integer }
        policy_revision: { type: integer, format: int64 }
        license_policy: { $ref: '#/components/schemas/AdminLicensePolicy' }
        registries:
          type: array
          items: { $ref: '#/components/schemas/AdminRegistry' }
        source_fingerprint: { type: string }
    AdminConfiguration:
      type: object
      required: [revision, snapshot]
      properties:
        revision: { type: integer, format: int64 }
        snapshot: { $ref: '#/components/schemas/AdminSnapshot' }
    AdminProfiles:
      type: object
      required: [profiles, source_harnesses]
      properties:
        profiles:
          type: array
          items:
            type: object
            required: [id, allowed_origins]
            properties:
              id: { type: string }
              allowed_origins:
                type: array
                items: { type: string }
        source_harnesses:
          type: array
          items: { type: string }
    AdminInstance:
      type: object
      required: [name, version, management_mode, revision, worker_status]
      properties:
        name: { type: string }
        version: { type: string }
        management_mode: { type: string }
        revision: { type: integer, format: int64 }
        worker_status: { type: string }
    AdminProposal:
      type: object
      required: [action, reason]
      properties:
        action:
          type: string
          enum: [upsert_registry, set_policy, pause, resume, withdraw, restore, retire, restore_retired, reindex]
        registry_id: { type: string }
        registry: { $ref: '#/components/schemas/AdminRegistry' }
        license_policy: { $ref: '#/components/schemas/AdminLicensePolicy' }
        reason: { type: string }
        confirm_origin_move: { type: boolean }
        confirm_unrestricted: { type: boolean }
    AdminChange:
      type: object
      required: [marketplace_id, revision, parent_revision, actor, operation, reason, request_id, idempotency_key, request_digest, snapshot, job_ids, created_at]
      properties:
        marketplace_id: { type: string }
        revision: { type: integer, format: int64 }
        parent_revision: { type: integer, format: int64 }
        actor: { $ref: '#/components/schemas/AdminActor' }
        operation: { type: string }
        reason: { type: string }
        request_id: { type: string }
        idempotency_key: { type: string }
        request_digest: { type: string }
        snapshot: { $ref: '#/components/schemas/AdminSnapshot' }
        job_ids:
          type: array
          nullable: true
          items: { type: string }
        created_at: { type: string, format: date-time }
    AdminAttempt:
      type: object
      required: [sequence, marketplace_id, registry_id, job_id, attempt, worker_id, registry_generation, policy_revision, configuration_revision, actor, operation, outcome, recorded_at]
      properties:
        sequence: { type: integer, format: int64 }
        marketplace_id: { type: string }
        registry_id: { type: string }
        job_id: { type: string }
        parent_job_id: { type: string }
        attempt: { type: integer }
        worker_id: { type: string }
        registry_generation: { type: integer, format: int64 }
        policy_revision: { type: integer, format: int64 }
        configuration_revision: { type: integer, format: int64 }
        request_id: { type: string }
        actor: { $ref: '#/components/schemas/AdminActor' }
        operation: { type: string }
        change_operation: { type: string }
        outcome: { type: string, enum: [started, failed, superseded, succeeded] }
        publication_id: { type: string }
        expected_publication_id: { type: string }
        recorded_at: { type: string, format: date-time }
    AdminJob:
      type: object
      required: [id, kind, status, attempt, max_attempts, created_at, updated_at]
      properties:
        id: { type: string }
        kind: { type: string }
        status: { type: string }
        attempt: { type: integer }
        max_attempts: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Capabilities:
      type: object
      required:
        - api_versions
        - artifact_schema_versions
        - resource_kinds
        - acquisition_modes
        - features
      properties:
        api_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        artifact_schema_versions:
          type: array
          items:
            type: string
            enum:
              - v1
        resource_kinds:
          type: array
          items:
            type: string
            enum:
              - skill
              - command
              - subagent
              - hook
              - mcpserver
              - collection
        acquisition_modes:
          type: array
          items:
            type: string
            enum:
              - index-only
              - mirror
        features:
          type: array
          items:
            type: string

    WellKnown:
      allOf:
        - $ref: "#/components/schemas/Capabilities"
        - type: object
          required:
            - instance_id
            - canonical_url
            - api_base
          properties:
            instance_id:
              type: string
            canonical_url:
              type: string
              format: uri
              description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.
            api_base:
              type: string
            browser_base:
              type: string
              format: uri
              description: Optional safe HTTP(S) base URL for the Nuxt browser frontend.
            browser_latest_route_template:
              type: string
              description: Present only when browser_base is configured.
            browser_exact_route_template:
              type: string
              description: Present only when browser_base is configured; revision is an exact SHA-256 content digest.

    Marketplace:
      type: object
      required:
        - id
        - name
        - canonical_url
      properties:
        id:
          type: string
        name:
          type: string
        canonical_url:
          type: string
          format: uri
          description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.
        instance_metadata:
          type: object
          additionalProperties: true

    RegistrySummary:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
      properties:
        id:
          type: string
        slug:
          type: string

    Registry:
      type: object
      additionalProperties: false
      description: Public registry metadata. Origins are sanitized to remove URL userinfo, fragments, and credential/signature-like query values; credentials, policy internals, and refresh diagnostics are never returned.
      required:
        - id
        - slug
        - ref
        - origins
        - acquisition
        - roots
        - listed
      properties:
        id:
          type: string
        slug:
          type: string
        aliases:
          type: array
          items:
            type: string
        origins:
          type: array
          description: Current and historical origins with URL userinfo removed and credential/signature-like query values redacted.
          items:
            type: string
        ref:
          type: string
        roots:
          type: array
          items:
            $ref: "#/components/schemas/RegistryRoot"
        acquisition:
          type: string
          enum:
            - index-only
            - mirror
        publisher:
          $ref: "#/components/schemas/Publisher"
        license:
          type: string
        listed:
          type: boolean

    RegistryRoot:
      type: object
      required:
        - path
      properties:
        path:
          type: string
        source_harness:
          type: string

    Publisher:
      type: object
      description: Public publisher metadata; unsafe legacy URLs are omitted.
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
          description: Safe HTTP(S) URL without userinfo, fragments, or credential/signature query parameters.

    RegistryOccurrence:
      type: object
      additionalProperties: false
      description: Immutable registry observation with an exact registry commit and canonical SHA-256 digests.
      required:
        - registry_id
        - ref
        - roots
        - commit
        - registry_revision_manifest_digest
        - acquisition
        - occurred_at
      properties:
        registry_id:
          type: string
        ref:
          type: string
        roots:
          type: array
          items:
            $ref: "#/components/schemas/RegistryRoot"
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact full-length lowercase Git commit identifier.
        registry_revision_manifest_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        acquisition:
          type: string
          enum:
            - index-only
            - mirror
        mirrored_artifact_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        occurred_at:
          type: string
          format: date-time

    ExactRegistryOccurrence:
      type: object
      additionalProperties: false
      description: Exact registry occurrence plus the current operator-approved acquisition origin.
      required:
        - registry_id
        - ref
        - roots
        - commit
        - registry_revision_manifest_digest
        - acquisition
        - acquisition_origin
        - occurred_at
      properties:
        registry_id:
          type: string
        ref:
          type: string
        roots:
          type: array
          items:
            $ref: "#/components/schemas/RegistryRoot"
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
        registry_revision_manifest_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        acquisition:
          type: string
          enum: [index-only, mirror]
        acquisition_origin:
          type: string
        occurred_at:
          type: string
          format: date-time

    SearchResult:
      type: object
      required:
        - items
        - total
        - offset
        - limit
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ResourceListItem"
        total:
          type: integer
        offset:
          type: integer
        limit:
          type: integer

    ResourceListItem:
      type: object
      required:
        - registry_id
        - kind
        - name
        - revision
        - content_digest
      properties:
        registry_id:
          type: string
        registry_slug:
          type: string
        kind:
          type: string
          enum:
            - skill
            - command
            - subagent
            - hook
            - mcpserver
            - collection
        name:
          type: string
        revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        content_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        description:
          type: string
          maxLength: 1024
          description: >-
            Author-written one-line summary from the upstream registry.
            Untrusted content: control characters are stripped, whitespace is
            collapsed, and the value is truncated to at most 1024 bytes on a
            UTF-8 boundary before it is stored or served. Omitted when the
            resource kind declares no description (hooks and MCP servers) or
            the author left it empty.
        availability:
          type: string
          enum:
            - available
            - blocked
            - policy-blocked
            - no-artifact
            - revoked
          description: >-
            Whether this revision can be installed from this instance, so a
            list card can show availability without fetching each resource.
            `available` means installable. `policy-blocked` means the current
            assessment rejected the revision. `no-artifact` means a mirrored
            revision has no artifact this instance can serve. `revoked` means
            an operator revoked the revision. `blocked` is the aggregate value
            used by older peers that cannot distinguish the reason. Optional:
            an instance that cannot determine availability omits the field,
            and clients must treat an absent value as unknown rather than as
            `available`.
        metadata:
          type: object
          additionalProperties:
            type: string
        score:
          type: number
          description: Server-assigned relevance score for the query.

    ResourceRevision:
      type: object
      additionalProperties: false
      required: [coordinate, content_digest, assessment, occurrence]
      properties:
        coordinate:
          $ref: "#/components/schemas/ResourceCoordinate"
        content_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        archive_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        license:
          type: string
        description:
          type: string
          maxLength: 1024
          description: >-
            Author-written one-line summary from the upstream registry, bounded
            and normalized identically to ResourceListItem.description.
        assessment:
          $ref: "#/components/schemas/ResourceAssessment"
        occurrence:
          $ref: "#/components/schemas/ResourceOccurrence"
        revocation:
          $ref: "#/components/schemas/Revocation"

    ResourceAssessment:
      type: object
      additionalProperties: false
      required: [coordinate, content_digest, assessment_digest, analyzer_version, policy_digest, decision, inspection_manifest_digest, assessed_at]
      properties:
        coordinate:
          $ref: "#/components/schemas/ResourceCoordinate"
        content_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        assessment_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        analyzer_version: { type: string, minLength: 1 }
        policy_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        decision: { type: string, enum: [allow, warn, reject] }
        findings:
          type: array
          items: { $ref: "#/components/schemas/AssessmentFinding" }
        inspection_manifest_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        assessed_at: { type: string, format: date-time }

    AssessmentFinding:
      type: object
      additionalProperties: false
      required: [code, severity]
      properties:
        code: { type: string }
        severity: { type: string }
        policy: { type: string }
        message: { type: string }
        location:
          $ref: "#/components/schemas/FindingLocation"

    FindingLocation:
      type: object
      additionalProperties: false
      required: [path]
      properties:
        path: { type: string, minLength: 1 }
        line: { type: integer, minimum: 1 }
        column: { type: integer, minimum: 1 }
        start_byte: { type: integer, minimum: 0 }
        end_byte: { type: integer, minimum: 0 }

    ResourceOccurrence:
      type: object
      additionalProperties: false
      required: [coordinate, content_digest, commit, manifest_digest]
      properties:
        coordinate:
          $ref: "#/components/schemas/ResourceCoordinate"
        content_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        commit: { type: string, pattern: "^[0-9a-f]{40}$" }
        manifest_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }

    Revocation:
      type: object
      additionalProperties: false
      required: [kind, target_id, reason, applied_at]
      properties:
        kind: { type: string, enum: [registry, coordinate, revision] }
        target_id: { type: string }
        reason: { type: string }
        applied_at: { type: string, format: date-time }

    InspectionManifest:
      type: object
      additionalProperties: false
      required: [schema_version, coordinate, revision_digest, primary_path, files]
      properties:
        schema_version: { type: string, enum: [v1] }
        coordinate:
          $ref: "#/components/schemas/ResourceCoordinate"
        revision_digest:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        primary_path: { type: string, enum: [SKILL.md, COMMAND.md, AGENT.md, HOOK.md, .mcp.json, COLLECTION.json] }
        files:
          type: array
          items: { $ref: "#/components/schemas/InspectionFile" }

    InspectionFile:
      type: object
      additionalProperties: false
      required: [path, content_digest, media_type, size, inspection_class]
      properties:
        path: { type: string }
        content_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        media_type: { type: string, enum: [text/markdown, text/plain, application/json, application/yaml, image/png, image/jpeg, image/gif, image/webp, application/octet-stream] }
        size: { type: integer, format: int64, minimum: 0 }
        inspection_class: { type: string, enum: [text, image, metadata] }

    ResourceCoordinate:
      type: object
      required: [marketplace, registry, kind, name]
      properties:
        marketplace: { type: string }
        registry: { type: string }
        kind: { type: string }
        name: { type: string }

    CatalogKeysetCursor:
      type: string
      minLength: 1
      description: Opaque, stateless encoding of the final immutable resource coordinate from the preceding page. It contains no credentials or server-side session identifier.

    CatalogETag:
      type: string
      pattern: '^"[^"]+"$'
      description: Strong quoted validator representing all catalog-visible current state, not only one page.

    CatalogIfNoneMatch:
      type: string
      minLength: 1
      description: HTTP conditional validator value. It may be `*` or a comma-separated list of quoted entity tags.

    CatalogPage:
      type: object
      additionalProperties: false
      required: [api_version, marketplace_id, catalog_version, complete, resources]
      properties:
        api_version:
          type: string
          enum: [agent-marketplace.io/catalog/v1alpha1]
        marketplace_id:
          type: string
        catalog_version:
          type: string
          minLength: 1
          description: Monotonic global catalog version for catalog-visible current state.
        complete:
          type: boolean
          description: True only on the final page of the current scan.
        next_cursor:
          $ref: "#/components/schemas/CatalogKeysetCursor"
        resources:
          type: array
          items:
            $ref: "#/components/schemas/CatalogResource"

    CatalogResource:
      type: object
      additionalProperties: false
      description: Current catalog-visible resource with embedded supporting registry identity and display metadata.
      required: [registry_id, registry_slug, kind, name, revision, availability]
      properties:
        registry_id:
          type: string
        registry_slug:
          type: string
        kind:
          type: string
          enum: [skill, command, subagent, hook, mcpserver, collection]
          description: Agent Marketplace resource kind. It is not a Backstage type.
        name:
          type: string
        description:
          type: string
          maxLength: 1024
          description: Optional normalized author-written resource summary. Collection description is omitted until it is covered by collection revision identity.
        revision:
          type: string
          pattern: "^sha256:[0-9a-f]{64}$"
        license:
          type: string
        availability:
          type: string
          enum: [available, blocked, revoked]
          description: Blocked and revoked rows remain catalog-visible so consumers can distinguish them from removed resources.
        source:
          $ref: "#/components/schemas/CatalogSource"
        collection:
          $ref: "#/components/schemas/CatalogCollection"
          description: Present only when kind is collection; non-collection rows omit it.

    CatalogSource:
      type: object
      additionalProperties: false
      description: Immutable source provenance. It is omitted for legacy occurrences without trustworthy source data.
      required: [repository_url, path, commit]
      properties:
        repository_url:
          type: string
          format: uri
          description: Safe HTTP(S) repository URL with userinfo, fragments, and credential/signature query values removed.
        path:
          type: string
          minLength: 1
          description: Normalized repository-relative path using slash separators.
        commit:
          type: string
          pattern: "^[0-9a-f]{40}$"
          description: Exact full-length lowercase Git commit identifier.

    CatalogCollection:
      type: object
      additionalProperties: false
      description: Direct collection relations only. Resources and includes are not recursively flattened.
      required: [resources, includes, unresolved_references]
      properties:
        resources:
          type: array
          description: Successfully resolved immediate resource declarations from the collection's legacy skills or current resources fields. Every coordinate references a catalog-visible row when this collection row is read.
          items:
            $ref: "#/components/schemas/CatalogCollectionResourceReference"
        includes:
          type: array
          description: Successfully resolved immediate collection declarations from the includes field. Every coordinate references a catalog-visible row when this collection row is read.
          items:
            $ref: "#/components/schemas/CatalogCollectionIncludeReference"
        unresolved_references:
          type: array
          description: Direct resource or include declarations that cannot be safely resolved. They are retained instead of becoming dangling coordinates.
          items:
            $ref: "#/components/schemas/CatalogUnresolvedReference"

    CatalogCollectionResourceReference:
      type: object
      additionalProperties: false
      required: [registry_id, kind, name]
      properties:
        registry_id:
          type: string
        kind:
          type: string
          enum: [skill, command, subagent, hook, mcpserver, collection]
        name:
          type: string

    CatalogCollectionIncludeReference:
      type: object
      additionalProperties: false
      required: [registry_id, kind, name]
      properties:
        registry_id:
          type: string
        kind:
          type: string
          enum: [collection]
        name:
          type: string

    CatalogUnresolvedReference:
      type: object
      additionalProperties: false
      required: [reference_type, kind, name, reason]
      properties:
        reference_type:
          type: string
          enum: [resource, include]
        registry_id:
          type: string
          description: Declared registry identifier when it was safe to preserve.
        kind:
          type: string
          enum: [skill, command, subagent, hook, mcpserver, collection]
        name:
          type: string
        reason:
          type: string
          minLength: 1
          description: Stable machine-readable resolution reason code.
