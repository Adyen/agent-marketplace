allowBuilds:
  esbuild: true
  unrs-resolver: true
  vue-demi: true
overrides:
  # Tiptap exact-pins its intra-family peerDependencies (extension-bold wants
  # @tiptap/core 3.29.2 exactly, and so on), so the whole family must move in
  # lockstep to the patched 3.30.5 release (GHSA-j95f-988m-3j2f,
  # GHSA-cp6q-959q-f8rh). @tiptap/y-tiptap declares no tiptap peers and stays 3.0.8.
  "@tiptap/core": "3.30.5"
  "@tiptap/extension-blockquote": "3.30.5"
  "@tiptap/extension-bold": "3.30.5"
  "@tiptap/extension-bubble-menu": "3.30.5"
  "@tiptap/extension-bullet-list": "3.30.5"
  "@tiptap/extension-code": "3.30.5"
  "@tiptap/extension-code-block": "3.30.5"
  "@tiptap/extension-collaboration": "3.30.5"
  "@tiptap/extension-document": "3.30.5"
  "@tiptap/extension-drag-handle": "3.30.5"
  "@tiptap/extension-drag-handle-vue-3": "3.30.5"
  "@tiptap/extension-dropcursor": "3.30.5"
  "@tiptap/extension-floating-menu": "3.30.5"
  "@tiptap/extension-gapcursor": "3.30.5"
  "@tiptap/extension-hard-break": "3.30.5"
  "@tiptap/extension-heading": "3.30.5"
  "@tiptap/extension-horizontal-rule": "3.30.5"
  "@tiptap/extension-image": "3.30.5"
  "@tiptap/extension-italic": "3.30.5"
  "@tiptap/extension-link": "3.30.5"
  "@tiptap/extension-list": "3.30.5"
  "@tiptap/extension-list-item": "3.30.5"
  "@tiptap/extension-list-keymap": "3.30.5"
  "@tiptap/extension-mention": "3.30.5"
  "@tiptap/extension-node-range": "3.30.5"
  "@tiptap/extension-ordered-list": "3.30.5"
  "@tiptap/extension-paragraph": "3.30.5"
  "@tiptap/extension-placeholder": "3.30.5"
  "@tiptap/extension-strike": "3.30.5"
  "@tiptap/extension-text": "3.30.5"
  "@tiptap/extension-underline": "3.30.5"
  "@tiptap/extensions": "3.30.5"
  "@tiptap/markdown": "3.30.5"
  "@tiptap/pm": "3.30.5"
  "@tiptap/starter-kit": "3.30.5"
  "@tiptap/suggestion": "3.30.5"
  "@tiptap/vue-3": "3.30.5"
  "devalue@<5.9.3": "5.9.3"
  "esbuild": "0.28.1"
  "js-yaml": "4.3.2"
  "launch-editor@<2.14.2": "2.14.2"
  "nanoid": "6.0.1"
  "prosemirror-view@<1.42.3": "1.42.3"
  "semver@^6.0.0": "7.7.3"
  "shell-quote@<1.11.0": "1.11.0"
  # 4.0.2 also upgrades the exact-pinned argv-parser to patched 2.0.1.
  "simple-git@<4.0.2": "4.0.2"
  "source-map-js@<1.2.2": "1.2.2"
  "svgo": "4.1.0"
  "undici": "8.10.2"
  "vite@>=8.2.0 <8.2.4": "8.2.4"
minimumReleaseAgeExclude:
  - undici
  # Targeted exceptions for security fixes; retain the general cooldown.
  - "@simple-git/*"
  - "@vitest/*"
  - launch-editor
  - markdown-it
  - sanitize-html
  - shell-quote
  - simple-git
  - source-map-js
  - vite
  - vitest
patchedDependencies:
  # simple-git v4 removes its default export; keep the existing consumer working.
  "@nuxt/devtools@3.4.0": patches/nuxt-devtools@3.4.0.patch
  # No fixed releases yet. Keep these patches until upstream releases fixes.
  # GHSA-vfj7-8cjw-p6xm; bounds parsed AST depth, including parentheses.
  braces@3.0.3: patches/braces@3.0.3.patch
  # GHSA-86w9-cpqp-85rv; digitalbazaar/forge#1152.
  node-forge@1.4.0: patches/node-forge@1.4.0.patch
