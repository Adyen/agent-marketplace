# Draft seed for pkg/harness-compilation/hookpolicy/catalogs/factory.yaml.
schema: 1
harness: factory
evidence:
  checked: "2026-09-29"
  refs:
    - https://docs.factory.ai/reference/hooks-reference
  notes: >-
    Hooks run from Droid's current working directory, which can differ from the
    repository root; Factory recommends "$FACTORY_PROJECT_DIR"/path. Common
    stdin fields are also exported as environment variables, but their names
    are not documented, so they are not listed. Group-level `commandRegex` is a
    Factory-only field kept for same-harness output.

env:
  project_dir: [FACTORY_PROJECT_DIR]
plugin_env:
  plugin_root: [DROID_PLUGIN_ROOT, CLAUDE_PLUGIN_ROOT]

repository_base: {env: project_dir}
timeout: {unit: seconds}
matcher: {syntax: exact-or-regex}
loads_hooks_of: []

events:
  PreToolUse: {canonical: PreToolUse, matcher: tool, types: [command]}
  PostToolUse: {canonical: PostToolUse, matcher: tool, types: [command]}
  UserPromptSubmit: {canonical: UserPromptSubmit, matcher: none, types: [command]}
  Notification: {canonical: Notification, matcher: lifecycle, types: [command]}
  Stop: {canonical: Stop, matcher: none, types: [command]}
  SubagentStop: {canonical: SubagentStop, matcher: lifecycle, types: [command]}
  PreCompact: {canonical: PreCompact, matcher: lifecycle, types: [command]}
  SessionStart: {canonical: SessionStart, matcher: lifecycle, types: [command]}
  SessionEnd: {canonical: SessionEnd, matcher: lifecycle, types: [command]}
